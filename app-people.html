<main class="app-main">
  <div class="wrap">
    <div class="app-head">
      <h1>People on PeerFlow</h1>
    </div>

    <p class="empty-hint" style="max-width:640px">
      Everyone who has signed up, newest first. This is the pool your partner comes from —
      no one here is made up.
    </p>

    <div class="stat-row" style="max-width:420px;background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:24px">
      <div class="stat"><b id="st-total">—</b><span>signed up</span></div>
      <div class="stat"><b id="st-same">—</b><span>on your topic</span></div>
    </div>

    <ul class="plist people-list" id="people">
      <li style="color:var(--muted);font-size:14px">Loading…</li>
    </ul>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/db.js"></script>
<script>
(function(){
  var name = '', myTopic = '';
  try {
    name = localStorage.getItem('pf_name') || '';
    myTopic = localStorage.getItem('pf_topic') || '';
  } catch(err) {}
  document.getElementById('nav-av').textContent = (name || 'S').charAt(0).toUpperCase();
  document.getElementById('logout').addEventListener('click', function(){
    try { ['pf_name','pf_email','pf_track','pf_topic','pf_pending'].forEach(function(k){ localStorage.removeItem(k); }); } catch(err) {}
    pf.signOut();
  });

  var pathLabel = { frontend:'Frontend', backend:'Backend', cybersecurity:'Cybersecurity', data:'Data & analytics', mobile:'Mobile', devops:'DevOps & cloud', aiml:'AI & ML', design:'UX/UI design' };
  var levelLabel = { new:'Just starting', tutorials:'Doing tutorials', jobprep:'Job-hunt prep', builder:'Builds projects' };
  var palette = ['#0b8f66','#3d8fd1','#8e6cc8','#d1793d','#c2568e','#5a9e6f'];

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function since(d){
    var days = Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
    if (isNaN(days)) return '';
    return days <= 0 ? 'joined today' : days === 1 ? 'joined yesterday' : 'joined ' + days + ' days ago';
  }

  var list = document.getElementById('people');

  pf.fetchPeers(24).then(function(people){
    if (people === null) {
      list.innerHTML = '<li style="color:var(--muted);font-size:14px">Could not load people — check your connection and refresh.</li>';
      return;
    }
    if (!people.length) {
      list.innerHTML = '<li style="color:var(--muted);font-size:14px">' +
        'No one else has signed up yet — you’re first. That’s genuinely useful to know: ' +
        'share PeerFlow with one person learning the same thing and you’ve got your pair.</li>';
      return;
    }
    list.innerHTML = people.map(function(p, i){
      var nm = p.name || 'Someone';
      var meta = [pathLabel[p.track_id] || '', p.topic ? 'Learning ' + p.topic : '', levelLabel[p.level] || '', p.timezone || '', since(p.created_at)]
        .filter(Boolean).join(' · ');
      var same = myTopic && p.topic && p.topic.toLowerCase() === myTopic.toLowerCase();
      return '<li>' +
        '<span class="av" style="background:' + palette[i % palette.length] + '">' + esc(nm.trim().charAt(0).toUpperCase()) + '</span>' +
        '<span><b>' + esc(nm) + (same ? ' <span class="same-tag">same topic</span>' : '') + '</b>' +
        '<span>' + esc(meta) + '</span></span>' +
        '</li>';
    }).join('');
  });

  pf.learnerStats(myTopic).then(function(s){
    if (!s) return;
    document.getElementById('st-total').textContent = s.total;
    document.getElementById('st-same').textContent = s.sameTopic;
  });
})();
</script>
