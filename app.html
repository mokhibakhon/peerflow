<script>
/* PeerFlow — Home.

   One question: what do I need to do next. The next session, a small partner
   snapshot, and this week. Everything else — history, achievements, matching,
   the calendar, settings — has its own page, and putting any of it here is
   what turned the old dashboard into a wall.

   Every state on this page is a real state with a next step attached. "No
   partner" links to finding one; "partner but nothing booked" offers the next
   hour you are both free. There is no dead empty text anywhere. */
(function(){
  var root = document.getElementById('hm-root');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  var TONES = [
    ['#EEEDFE','#3C3489'], ['#E1F5EE','#0F6E56'], ['#FBEAF0','#A94168'],
    ['#E6F1FB','#185FA5'], ['#FAEEDA','#854F0B'], ['#FAECE7','#993C1D'],
    ['#F5EAF8','#58256B'], ['#EDF0F3','#35414F']
  ];
  function tone(n){
    var s = String(n || '?'), h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return TONES[h % TONES.length];
  }
  function initial(n){ return (String(n || '').trim().charAt(0) || 'S').toUpperCase(); }
  function firstName(n){ return String(n || '').trim().split(/\s+/)[0] || ''; }

  var JOIN_MS = 15 * 60 * 1000;      // the existing join window
  var READY_MS = 10 * 60 * 1000;     // "are you still joining?"

  /* "Today · 19:00", "Tomorrow · 19:00", "Thu 14 Aug · 19:00". */
  function whenLabel(d){
    var day = new Date(d); day.setHours(0,0,0,0);
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.round((day - today) / 864e5);
    var time = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', hour12:false });
    if (diff === 0) return 'Today · ' + time;
    if (diff === 1) return 'Tomorrow · ' + time;
    return d.toLocaleDateString([], { weekday:'short', day:'numeric', month:'short' }) + ' · ' + time;
  }

  /* ---------- the next session ---------- */
  function nextSessionHtml(s, partnerState, partnerName){
    var now = Date.now();
    var start = s.startsAt.getTime();
    var end = start + s.durationMin * 60000;
    var joinable = now >= start - JOIN_MS && now <= end;
    var asking = now >= start - READY_MS && now < end;   // "are you still joining?"
    var mine = !!s.confirmedAt;
    var theirs = partnerState ? partnerState.confirmed : false;

    var who = firstName(partnerName) || 'Your partner';

    var acts = [];
    if (!mine) acts.push('<button class="btn" data-act="confirm">' +
      (asking ? 'I’m ready' : 'Confirm') + '</button>');
    if (joinable) acts.push('<a class="btn' + (mine ? '' : ' dark') + '" data-act="join" href="' +
      'app-room.html?at=' + encodeURIComponent(s.startsAt.toISOString()) +
      '&room=' + encodeURIComponent(s.roomUrl || '') + '">Join session</a>');
    acts.push('<button class="ghost" data-act="cancel">' +
      (asking ? 'I need to cancel' : 'Can’t attend') + '</button>');

    return '<div class="hm-next' + (joinable ? ' live' : '') + '">' +
      '<div class="hm-when">' + esc(whenLabel(s.startsAt)) + ' · ' + s.durationMin + ' minutes</div>' +
      '<h2>' + esc(s.topic || 'Study session') + (partnerName ? ' with ' + esc(who) : '') + '</h2>' +
      '<p class="meta">' + (joinable
          ? 'The room is open.'
          : asking ? 'Starting soon — are you still joining?'
                   : 'Nothing to do yet. Confirm when you know you’ll be there.') + '</p>' +
      (s.goal ? '<p class="hm-goal"><b>Your goal:</b> ' + esc(s.goal) + '</p>' : '') +
      '<div class="hm-att">' +
        '<span class="' + (theirs ? 'yes' : '') + '"><i></i>' + esc(who) + ' — ' +
          (theirs ? 'Confirmed' : 'Not confirmed') + '</span>' +
        '<span class="' + (mine ? 'yes' : '') + '"><i></i>You — ' +
          (mine ? 'Confirmed' : 'Not confirmed') + '</span>' +
      '</div>' +
      '<div class="hm-acts">' + acts.join('') + '</div>' +
      '<p class="bk-status" id="hm-status" hidden></p>' +
    '</div>';
  }

  /* ---------- the small cards ---------- */
  function partnerCardHtml(partner, sessions, rel){
    if (!partner) {
      return '<div class="hm-card">' +
        '<h3>Partner</h3>' +
        '<p class="meta" style="margin:0 0 14px">You don’t have a study partner yet.</p>' +
        '<a class="btn" href="app-people.html">Find my partner</a></div>';
    }
    var p = partner.profile || {};
    var name = p.name || 'Your partner';
    var t = tone(name);
    var trackName = (pf.trackNames && pf.trackNames[p.track_id]) || p.track_id || '';
    var now = Date.now();
    var done = (sessions || []).filter(function(s){
      return (s.partnerName || '') === name &&
        (s.status === 'completed' ||
         (s.status === 'confirmed' && s.startsAt.getTime() + s.durationMin * 60000 <= now));
    });
    var WEEK = 7 * 864e5, weeks = {};
    done.forEach(function(s){ weeks[Math.floor(s.startsAt.getTime() / WEEK)] = true; });
    var idx = Object.keys(weeks).map(Number).sort(function(a,b){ return a-b; });
    var streak = 0;
    if (idx.length && Math.floor(now / WEEK) - idx[idx.length-1] <= 1) {
      streak = 1;
      for (var i = idx.length - 1; i > 0; i--) {
        if (idx[i] - idx[i-1] === 1) streak++; else break;
      }
    }
    var att = (rel && rel.counted > 0) ? rel.pct + '%' : '—';

    return '<div class="hm-card">' +
      '<h3>Partner</h3>' +
      '<div class="hm-who">' +
        '<span class="pt-face" style="background:' + t[0] + ';color:' + t[1] + '">' +
          esc(initial(name)) + '</span>' +
        '<div><b>' + esc(name) + '</b><span>' + esc(trackName) + '</span></div>' +
      '</div>' +
      '<div class="hm-mini">' +
        '<div><b>' + done.length + '</b><span>sessions</span></div>' +
        '<div><b>' + esc(att) + '</b><span>attendance</span></div>' +
        '<div><b>' + streak + '</b><span>week streak</span></div>' +
      '</div></div>';
  }

  function weekCardHtml(sessions){
    var now = new Date();
    var monday = new Date(now); monday.setHours(0,0,0,0);
    monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
    var sunday = new Date(monday); sunday.setDate(sunday.getDate() + 7);

    var week = (sessions || []).filter(function(s){
      return s.startsAt >= monday && s.startsAt < sunday &&
             s.status !== 'declined' && s.status !== 'cancelled';
    });
    var planned = week.length;
    var doneN = week.filter(function(s){
      return s.status === 'completed' ||
             (s.status === 'confirmed' && s.startsAt.getTime() + s.durationMin * 60000 <= Date.now());
    }).length;
    var minutes = week.reduce(function(a, s){
      var over = s.status === 'completed' ||
        (s.status === 'confirmed' && s.startsAt.getTime() + s.durationMin * 60000 <= Date.now());
      return a + (over ? (s.durationMin || 0) : 0);
    }, 0);
    var pct = planned ? Math.round((doneN / planned) * 100) : 0;

    return '<div class="hm-card">' +
      '<h3>This week</h3>' +
      '<div class="hm-mini">' +
        '<div><b>' + doneN + ' of ' + planned + '</b><span>sessions done</span></div>' +
        '<div><b>' + (minutes / 60).toFixed(1) + 'h</b><span>focused</span></div>' +
      '</div>' +
      '<div class="hm-week"><i style="width:' + pct + '%"></i></div>' +
      '<p class="meta" style="font-size:13px;margin:0">' +
        (planned ? pct + '% of what you planned this week.'
                 : 'Nothing booked this week yet.') + '</p>' +
    '</div>';
  }

  /* ---------- the "nothing booked" prompt ---------- */
  /* A partner and no session is the single most important empty state in the
     product, so it does the work: it names the next hour the two of you are
     free and offers it in one click. */
  function nothingBookedHtml(partner, profile){
    var name = firstName((partner.profile || {}).name) || 'your partner';
    var shared = pf.sharedSlots(profile && profile.availability,
                                (partner.profile || {}).availability);
    if (!shared.length) {
      return '<div class="hm-empty">' +
        '<h2>Nothing booked with ' + esc(name) + '</h2>' +
        '<p>You don’t have hours in common yet. Add a few more weekly windows ' +
          'and the times you share will show up here.</p>' +
        '<a class="btn" href="app-profile.html">Edit availability</a></div>';
    }
    var slot = shared[0];
    var hour = pf.slotHours(slot)[0];
    return '<div class="hm-empty">' +
      '<h2>Nothing booked with ' + esc(name) + '</h2>' +
      '<p>You’re both free ' + esc(pf.slotLabel(slot)) + '. Propose it and ' +
        esc(name) + ' can accept in one tap.</p>' +
      '<button class="btn" id="hm-quick" data-slot="' + esc(slot) + '" data-hour="' + hour + '">' +
        'Propose ' + esc(pf.slotLabel(slot)) + '</button> ' +
      '<a class="ghost" href="app-partner.html#schedule">Pick another time</a>' +
      '<p class="bk-status" id="hm-status" hidden></p></div>';
  }

  /* ---------- actions ---------- */
  function say(msg, bad){
    var st = document.getElementById('hm-status');
    if (!st) return;
    st.hidden = false;
    st.textContent = msg;
    st.className = 'bk-status' + (bad ? ' bk-warn' : '');
  }

  function wire(next, partner, profile){
    root.addEventListener('click', function(e){
      var b = e.target.closest('[data-act]');
      if (b && next) {
        var act = b.getAttribute('data-act');
        if (act === 'join') return;                 // it's a link; let it through
        e.preventDefault();

        if (act === 'confirm') {
          b.disabled = true; b.textContent = 'Confirming…';
          pf.confirmAttendance(next.startsAt.toISOString(), next.roomUrl).then(function(r){
            if (r && r.error) { b.disabled = false; b.textContent = 'Confirm'; say(r.error, true); return; }
            if (partner) pf.notifyPartner(partner.profile.id, 'attendance',
              ((profile && profile.name) || 'Your partner') + ' confirmed',
              whenLabel(next.startsAt), 'app-sessions.html');
            load();
          });
          return;
        }

        if (act === 'cancel') {
          /* Cancelling a confirmed session tells the other person rather than
             removing it from their calendar without explanation. How close to
             the start it happened is recorded, so reliability can tell an
             early cancellation from a no-show. */
          b.disabled = true; b.textContent = 'Cancelling…';
          pf.cancelBooked(next.startsAt.toISOString(), next.roomUrl).then(function(r){
            if (r && r.error) { b.disabled = false; b.textContent = 'Can’t attend'; say(r.error, true); return; }
            if (partner) pf.notifyPartner(partner.profile.id, 'session_cancelled',
              ((profile && profile.name) || 'Your partner') + ' cancelled',
              whenLabel(next.startsAt), 'app-sessions.html');
            load();
          });
          return;
        }
      }

      /* One-tap propose from the empty state. */
      var q = e.target.closest('#hm-quick');
      if (q && partner) {
        var when = pf.nextDateFor(q.getAttribute('data-slot'), parseInt(q.getAttribute('data-hour'), 10));
        if (!when) return;
        q.disabled = true; q.textContent = 'Sending…';
        pf.proposeSession({
          partnerId: partner.profile.id,
          partnerName: (partner.profile || {}).name || null,
          myName: (profile && profile.name) || '',
          topic: (profile && profile.topic) ||
                 (pf.trackNames || {})[profile && profile.track_id] || null,
          startsAt: when.toISOString(),
          durationMin: (profile && profile.pref_minutes) || 50,
          roomUrl: partner.roomUrl,
          pairId: partner.requestId
        }).then(function(r){
          if (r && r.error) { q.disabled = false; say(r.error, true); return; }
          if (r && r.demo) { say('Demo mode — this would send that time.'); return; }
          pf.notifyPartner(partner.profile.id, 'session_proposal',
            ((profile && profile.name) || 'Your partner') + ' proposed a time',
            whenLabel(when), 'app-sessions.html');
          say('Sent. Waiting for them to accept.');
          q.textContent = 'Proposed';
        });
      }
    });
  }

  /* ---------- load ---------- */
  function load(){
    Promise.all([pf.primaryPartner(), pf.getProfile(), pf.fetchSessions(), pf.reliability()])
    .then(function(r){
      var partner = r[0], profile = r[1] || null, sessions = r[2] || [], rel = r[3];

      var hello = document.getElementById('hm-hello');
      var fn = firstName(profile && profile.name);
      if (fn) hello.textContent = 'Hello, ' + fn;

      /* The soonest confirmed session that hasn't finished. Proposals are not
         "next up" — nobody has agreed to them yet, so they live on Sessions. */
      var now = Date.now(), next = null;
      sessions.forEach(function(s){
        if (s.status !== 'confirmed') return;
        if (s.startsAt.getTime() + s.durationMin * 60000 <= now) return;
        if (!next || s.startsAt < next.startsAt) next = s;
      });

      function paint(pstate){
        var top;
        if (next) top = nextSessionHtml(next, pstate, next.partnerName);
        else if (partner) top = nothingBookedHtml(partner, profile);
        else top = '<div class="hm-empty">' +
          '<h2>Find your study partner</h2>' +
          '<p>Tell us what you’re learning and when you’re free, and we’ll show ' +
            'you the people closest to it. One partner, not a group.</p>' +
          '<a class="btn" href="app-people.html">Find my partner</a></div>';

        root.innerHTML = top +
          '<div class="hm-row">' +
            partnerCardHtml(partner, sessions, rel) +
            weekCardHtml(sessions) +
          '</div>';
        wire(next, partner, profile);
      }

      if (next) {
        pf.partnerState(next.startsAt.toISOString(), next.roomUrl).then(paint);
      } else {
        paint(null);
      }
    }).catch(function(){
      root.innerHTML = '<div class="hm-empty"><h2>We couldn’t load your day</h2>' +
        '<p>Refresh the page to try again.</p></div>';
    });
  }

  if (!window.pf || !pf.ready || !pf.ready()) {
    root.innerHTML = '<div class="hm-empty"><h2>Demo mode</h2>' +
      '<p>Home shows your next session, your partner and your week. All of it is ' +
        'read from real rows, so there is nothing to preview without a connected ' +
        'account.</p><a class="btn" href="signup.html">Create an account</a></div>';
    return;
  }
  load();
})();
</script>
