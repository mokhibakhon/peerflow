<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar preview — PeerFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20173%20171%22%20fill%3D%22%231D9E75%22%3E%3Crect%20x%3D%2279%22%20y%3D%220%22%20width%3D%2213%22%20height%3D%2215%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2281%22%20width%3D%2215%22%20height%3D%2213%22%2F%3E%3Crect%20x%3D%22158%22%20y%3D%2281%22%20width%3D%2214%22%20height%3D%2213%22%2F%3E%3Crect%20x%3D%2279%22%20y%3D%22156%22%20width%3D%2213%22%20height%3D%2215%22%2F%3E%3Cpath%20d%3D%22M52%2024H116V39H99V56H83V70H67V39H52Z%22%2F%3E%3Cpath%20d%3D%22M24%2057H39V74H56V89H70V106H39V121H24Z%22%2F%3E%3Cpath%20d%3D%22M134%2053H149V118H134V101H117V85H103V69H134Z%22%2F%3E%3Cpath%20d%3D%22M119%20147H55V132H72V115H88V101H104V132H119Z%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"></noscript>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<!-- ============================================================
     Calendar preview.

     The calendar on app.html only draws once you are signed in, have a
     partner, and the two of you have overlapping availability — so there is
     no way to look at the design without first arranging all three. This page
     renders the same markup and the same stylesheet against fixed sample
     rows, so the layout can be reviewed on its own.

     Nothing here talks to Supabase and nothing here is linked from the app.
     It is a design surface, not a feature. Delete it whenever it stops being
     useful — no other file references it.
     ============================================================ -->

<main style="max-width:1320px;margin:0 auto;padding:32px">

  <p style="font-size:13px;color:var(--faint);margin:0 0 6px;font-family:var(--mono);
            letter-spacing:.07em;text-transform:uppercase">Design preview</p>
  <h1 style="font-size:26px;margin:0 0 6px">Calendar</h1>
  <p style="color:var(--soft);font-size:15px;margin:0 0 26px;max-width:60ch">
    Sample sessions, not real ones. This is the same markup and stylesheet the
    app uses, shown here so the layout can be checked without signing in and
    arranging a partner first.
  </p>

  <section class="b wide" id="cal-card">
    <div class="cal-head">
      <h2 style="margin:0;font-size:21px;font-weight:700;letter-spacing:-.025em">Calendar</h2>
      <div class="cal-nav">
        <button class="cal-step" type="button" aria-label="Previous week">&lsaquo;</button>
        <span class="cal-range">Aug 3 – Aug 9</span>
        <button class="cal-step" type="button" aria-label="Next week">&rsaquo;</button>
        <button class="small" type="button" style="margin-left:8px">Today</button>
      </div>
      <button class="btn" type="button">+ New session</button>
    </div>

    <div class="cal-scroll"><div class="cal-grid" id="grid"></div></div>

    <p class="cal-key">
      <span class="k1"><i></i>Booked</span>
      <span class="k2"><i></i>Waiting on an answer</span>
      <span class="k3"><i></i>You’re both free — click to propose</span>
    </p>
  </section>
</main>

<script>
/* Draws the grid from a fixed list, using exactly the classes app.html
   generates. Kept deliberately dumb: no dates, no timezones, no data layer —
   if this page ever disagrees with the real calendar, the stylesheet is what
   matters and this is only a frame to look at it in. */
(function(){
  var DAYS  = [['Mon',3],['Tue',4],['Wed',5],['Thu',6],['Fri',7],['Sat',8],['Sun',9]];
  var HOURS = [16,17,18,19,20,21,22];
  var TODAY = 6;                                  // index into DAYS

  /* Hours the pair share, as day-index → [hours]. */
  var FREE = { 1:[17,18,19,20,21], 3:[17,18,19,20,21], 6:[19,20,21] };

  /* day, hour, title, sub, state */
  var EVENTS = [
    [0, 19, 'React Hooks Practice', '19:00 · Amir',  'waiting'],
    [1, 20, 'REST API Design',      '20:00 · Dilnoza','booked'],
    [2, 18, 'LeetCode Medium',      '18:00 · Amir',  'waiting'],
    [3, 19, 'Portfolio Review',     '19:00 · Bekzod','booked'],
    [4, 20, 'System Design Chat',   '20:00 · Amir',  'waiting'],
    [6, 20, 'Cybersecurity',        '20:00 · Amir',  'booked']
  ];

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  var out = ['<div class="cal-corner"></div>'];
  DAYS.forEach(function(d, i){
    out.push('<div class="cal-day' + (i === TODAY ? ' today' : '') + '">' +
             '<span>' + d[0] + '</span><b>' + d[1] + '</b></div>');
  });

  HOURS.forEach(function(h){
    out.push('<div class="cal-h">' + (h < 10 ? '0' : '') + h + ':00</div>');
    DAYS.forEach(function(d, i){
      var ev = null;
      EVENTS.forEach(function(e){ if (e[0] === i && e[1] === h) ev = e; });
      var free = (FREE[i] || []).indexOf(h) >= 0 && !ev;
      out.push('<div class="cal-cell' + (free ? ' free' : '') + '">' +
        (ev ? '<span class="cal-ev ' + ev[4] + '"><b>' + esc(ev[2]) + '</b>' +
              '<i>' + esc(ev[3]) + '</i></span>' : '') +
        '</div>');
    });
  });

  document.getElementById('grid').innerHTML = out.join('');
})();
</script>
</body>
</html>
