</head>
<body>

<main>
  <div class="wrap">
    <div class="app-head">
      <h1>Find your partner</h1>
    </div>

    <p class="empty-hint" style="max-width:620px">
      The people closest to what you’re learning, strongest first. Send one
      request — you’re looking for a single partner, not a list of contacts.
    </p>

    <p class="bk-status" id="fp-status" hidden></p>

    <div class="fp-list" id="fp-list" aria-live="polite">
      <div class="fp-card"><div class="fp-body"><p class="sub">Finding your matches…</p></div></div>
    </div>
  </div>
</main>

<div class="mfoot">
  <a href="conduct.html">Code of conduct</a>
  <a href="app-profile.html">Your profile</a>
  <span>peerflow</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/db.js"></script>
<script src="assets/authgate.js"></script>
<script>
/* PeerFlow — Find Partner.

   A short ranked list, deliberately not a directory. The scoring lives in
   db.js (rankedMatches) so the same rules can be reused; this page's job is to
   explain each result and send one request.

   Nothing here is invented. An empty list means nobody else on this path has
   signed up yet, and the page says exactly that instead of padding itself
   with people who don't exist. */
(function(){
  var list = document.getElementById('fp-list');
  var LEVEL = { 'new':'Just starting', tutorials:'Working through tutorials',
                builder:'Building things', jobprep:'Preparing for work' };

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function say(msg, bad){
    var st = document.getElementById('fp-status');
    st.hidden = false;
    st.textContent = msg;
    st.className = 'bk-status' + (bad ? ' bk-warn' : '');
  }

  /* Which reasons deserve the accent colour: the ones that actually decide a
     good match, rather than every fact we happen to know. */
  var KEY = /^(Same path|Same stage|\d+ shared)/;

  function card(m, top){
    return '<article class="fp-card' + (top ? ' top' : '') + '" data-id="' + esc(m.id) + '">' +
      '<div class="fp-body">' +
        '<h3>' + esc(m.name) + '</h3>' +
        '<p class="sub">' + esc(m.trackName || 'Path not set') +
          (m.level ? ' · ' + esc(LEVEL[m.level] || m.level) : '') +
          (m.topic ? ' · ' + esc(m.topic) : '') + '</p>' +
        '<div class="fp-why">' +
          m.why.map(function(w){
            return '<span class="' + (KEY.test(w) ? 'key' : '') + '">' + esc(w) + '</span>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<div class="fp-score"><b>' + m.match + '%</b><span>match</span></div>' +
      '<div class="fp-acts">' +
        '<button class="btn" data-ask="' + esc(m.id) + '">Send request</button>' +
      '</div>' +
    '</article>';
  }

  /* The ask box. An optional note is the difference between a cold request and
     one somebody can say yes to, so it is offered but never required. */
  function askBox(m){
    return '<div class="fp-note">' +
      '<label class="hint" for="fp-msg">Add a note (optional) — what you’re working on and when you usually study.</label>' +
      '<textarea id="fp-msg" maxlength="400" placeholder="I’m working through networking fundamentals and usually study Tuesday and Thursday evenings."></textarea>' +
      '<div class="fp-acts" style="margin-top:0">' +
        '<button class="btn" data-send="' + esc(m.id) + '">Send to ' + esc(m.name.split(' ')[0]) + '</button>' +
        '<button class="ghost" data-cancel="1">Cancel</button>' +
      '</div></div>';
  }

  function renderEmpty(profile){
    var track = (profile && pf.trackNames && pf.trackNames[profile.track_id]) || '';
    if (!profile || !profile.track_id) {
      list.innerHTML = '<div class="hm-empty">' +
        '<h2>Tell us what you’re learning</h2>' +
        '<p>We match on your path, your stage and the hours you’re free. Fill those ' +
          'in and your matches will appear here.</p>' +
        '<a class="btn" href="app-profile.html">Complete my profile</a></div>';
      return;
    }
    list.innerHTML = '<div class="hm-empty">' +
      '<h2>Nobody on ' + esc(track || 'your path') + ' yet</h2>' +
      '<p>You’re early. Nobody else studying this has finished signing up — we won’t ' +
        'invent a partner to fill the gap. Invite someone you know and you’ll both ' +
        'have a match straight away.</p>' +
      '<button class="btn" id="fp-invite">Copy invite link</button></div>';

    var b = document.getElementById('fp-invite');
    if (b) b.addEventListener('click', function(){
      var url = location.origin + location.pathname.replace(/[^/]*$/, '') + 'signup.html';
      try {
        navigator.clipboard.writeText(url).then(function(){ b.textContent = 'Link copied'; });
      } catch (e) { b.textContent = url; }
    });
  }

  /* ---------- actions ---------- */
  list.addEventListener('click', function(e){
    var ask = e.target.closest('[data-ask]');
    if (ask) {
      var art = ask.closest('.fp-card');
      var m = MATCHES[ask.getAttribute('data-ask')];
      if (!m) return;
      ask.closest('.fp-acts').outerHTML = askBox(m);
      var ta = art.querySelector('#fp-msg');
      if (ta) ta.focus();
      return;
    }

    var cancel = e.target.closest('[data-cancel]');
    if (cancel) {
      var artC = cancel.closest('.fp-card');
      var id = artC.getAttribute('data-id');
      artC.querySelector('.fp-note').outerHTML =
        '<div class="fp-acts"><button class="btn" data-ask="' + esc(id) + '">Send request</button></div>';
      return;
    }

    var send = e.target.closest('[data-send]');
    if (send) {
      var artS = send.closest('.fp-card');
      var toId = send.getAttribute('data-send');
      var note = (artS.querySelector('#fp-msg') || {}).value || '';
      send.disabled = true;
      send.textContent = 'Sending…';

      pf.sendPartnerRequest(toId, note.trim() || null).then(function(r){
        if (r && r.error) {
          send.disabled = false;
          send.textContent = 'Send request';
          say(r.error, true);
          return;
        }
        if (r && r.demo) { say('Demo mode — nothing was sent.'); return; }

        var m = MATCHES[toId] || { name: 'them' };
        artS.querySelector('.fp-note').outerHTML =
          '<div class="fp-acts"><span class="se-tag wait">Request sent — waiting for ' +
          esc(m.name.split(' ')[0]) + '</span></div>';
        say('Sent. You’ll get a notification when they answer.');

        /* Best-effort: the request itself is the record, so a notification
           that doesn't land must not look like a failure. */
        pf.notifyRequest(toId, (MY_NAME || 'Someone') + ' wants to study with you',
                         note.trim() || null);
      });
    }
  });

  /* ---------- load ---------- */
  var MATCHES = {}, MY_NAME = '';

  if (!window.pf || !pf.ready || !pf.ready()) {
    list.innerHTML = '<div class="hm-empty"><h2>Demo mode</h2>' +
      '<p>Matches are real people who have signed up, so there is nothing to show ' +
        'without a connected account.</p>' +
      '<a class="btn" href="signup.html">Create an account</a></div>';
    return;
  }

  /* Already partnered? This page is for people who aren't. Send them to the
     partner they already have rather than tempting them to browse. */
  Promise.all([pf.primaryPartner(), pf.getProfile()]).then(function(r){
    if (r[0]) { location.replace('app-partner.html'); return; }
    var profile = r[1] || null;
    MY_NAME = (profile && profile.name) || '';

    pf.rankedMatches(8).then(function(matches){
      if (!matches || !matches.length) { renderEmpty(profile); return; }
      MATCHES = {};
      matches.forEach(function(m){ MATCHES[m.id] = m; });
      list.innerHTML = matches.map(function(m, i){ return card(m, i === 0); }).join('');
    });
  }).catch(function(){
    list.innerHTML = '<div class="hm-empty"><h2>We couldn’t load your matches</h2>' +
      '<p>Refresh the page to try again.</p></div>';
  });
})();
</script>
<script src="assets/appshell.js"></script>
<script src="assets/usermenu.js"></script>
<script src="assets/notify.js"></script>
</body>
</html>
