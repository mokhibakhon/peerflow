<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step two — the exchange, five colourways</title>
<link rel="stylesheet" href="app.css">
<style>
  /* One layout — the exchange with a face on each bubble — in five
     colourways. Read at about 403px in the card, so everything is near three
     times its final size. */
  body{margin:0;background:#fff;font-family:var(--body)}
  .frame{width:1280px;height:841px;background:#fff;border:1px solid #E7E6EC;
    border-radius:15px;overflow:hidden;display:flex;flex-direction:column;margin:0 0 40px}
  .body{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:0 64px}

  .tick{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;
    background:#1D9E75;vertical-align:-11px;margin-left:14px}
  .tick svg{width:26px;height:26px}

  /* ---------- 1: with faces ---------- */
  .thread{width:100%;max-width:960px;display:flex;flex-direction:column;gap:40px}
  .line{display:flex;align-items:flex-end;gap:20px}
  .line.mine{flex-direction:row-reverse}
  .av{width:88px;height:88px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    font-size:34px;font-weight:800}
  .b{padding:32px 40px;border-radius:36px;font-size:46px;font-weight:600;letter-spacing:-.02em;
    line-height:1.25;max-width:660px}
  .b.them{border-bottom-left-radius:12px}
  .b.me{border-bottom-right-radius:12px}

  /* 1 — green and grey. What it is now: the question carries the brand, the
     answer is neutral. */
  #v-a .b.me{background:#0F6E56;color:#fff;box-shadow:0 8px 22px rgba(8,80,65,.22)}
  #v-a .b.them{background:#F1F0F4;color:var(--ink)}

  /* 2 — two greens. No grey anywhere, so the card belongs to the same family
     as the buttons in step one and the tiles in step three. */
  #v-b .b.me{background:#0F6E56;color:#fff;box-shadow:0 8px 22px rgba(8,80,65,.22)}
  #v-b .b.them{background:#DFF0EA;color:#0A4A3B}

  /* 3 — flipped. The agreement is the point of the step, so the yes is the
     loud one and the question is quiet. */
  #v-c .b.me{background:#E8E7EE;color:#3B3F58}
  #v-c .b.them{background:#0F6E56;color:#fff;box-shadow:0 8px 22px rgba(8,80,65,.22)}
  #v-c .tick{background:#fff}
  #v-c .tick svg path{stroke:#0F6E56}

  /* 4 — ink and green. Two brand colours rather than one: the ink is the
     nav button, the green is everything else. */
  #v-d .b.me{background:#171A2E;color:#fff;box-shadow:0 8px 22px rgba(23,26,46,.24)}
  #v-d .b.them{background:#DFF0EA;color:#0A4A3B}

  /* 5 — outline. Both bubbles white on white, and the only colour on the
     card is the tick. */
  #v-e .b.me{background:#fff;color:var(--ink);border:3px solid #0F6E56;
    box-shadow:0 6px 18px rgba(8,80,65,.10)}
  #v-e .b.them{background:#fff;color:var(--ink);border:3px solid #E7E6EC}

  /* ---------- 2: in a window ---------- */
  .win{width:100%;max-width:940px;border:2px solid #E7E6EC;border-radius:34px;overflow:hidden;
    box-shadow:0 20px 46px rgba(23,26,46,.10)}
  .win-h{display:flex;align-items:center;gap:20px;padding:28px 34px;border-bottom:2px solid #F1F0F4;
    background:#FBFBFC}
  .win-h .av{width:70px;height:70px;font-size:28px}
  .win-h .n{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
  .win-h .n span{display:block;font-size:24px;font-weight:400;color:#9497A9;margin-top:2px}
  .win-b{padding:38px 34px;display:flex;flex-direction:column;gap:32px}
  .win-b .b{font-size:42px;padding:28px 34px;max-width:74%}
  .win-b .b.me{align-self:flex-end}
  .win-b .b.them{align-self:flex-start}

  /* ---------- 3: exchange, then the result ---------- */
  .mini{width:100%;max-width:900px;display:flex;flex-direction:column;gap:26px;margin-bottom:52px}
  .mini .b{font-size:38px;padding:24px 32px;border-radius:28px;max-width:70%}
  .mini .b.me{align-self:flex-end}
  .mini .b.them{align-self:flex-start}
  .out{display:flex;align-items:center;gap:24px;background:#E7F6F0;border:3px solid #9FE1CB;
    border-radius:26px;padding:30px 38px;width:100%;max-width:900px}
  .out .k{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;
    background:#0F6E56;flex:0 0 auto}
  .out .k svg{width:34px;height:34px}
  .out b{font-size:44px;font-weight:800;letter-spacing:-.03em;color:#0A3D31}
  .out span{font-family:var(--mono);font-size:22px;letter-spacing:.09em;text-transform:uppercase;
    color:#0F6E56;margin-left:auto}

  /* ---------- 4: two lines, nothing else ---------- */
  .big{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:44px}
  .big .b{font-size:62px;font-weight:700;letter-spacing:-.03em;padding:42px 52px;
    border-radius:48px;line-height:1.2;max-width:82%}
  .big .b.me{align-self:flex-end;border-bottom-right-radius:14px}
  .big .b.them{align-self:flex-start;border-bottom-left-radius:14px}
  .big .tick{width:58px;height:58px;margin-left:18px;vertical-align:-13px}
  .big .tick svg{width:32px;height:32px}

  /* ---------- 5: the answer is the picture ---------- */
  .quiet{width:100%;max-width:880px;display:flex;flex-direction:column;gap:20px;margin-bottom:56px}
  .quiet .b{font-size:32px;font-weight:600;padding:20px 28px;border-radius:22px;max-width:62%;
    letter-spacing:-.015em}
  .quiet .b.me{align-self:flex-end;background:#DFF0EA;color:#0A4A3B;box-shadow:none}
  .quiet .b.them{align-self:flex-start;background:#F1F0F4;color:#585C74}
  .hero-time{text-align:center}
  .hero-time b{display:block;font-size:88px;font-weight:800;letter-spacing:-.045em;
    color:var(--ink);line-height:1}
  .hero-time b em{font-style:normal;color:#0F6E56}
  .hero-time span{display:block;font-family:var(--mono);font-size:24px;letter-spacing:.1em;
    text-transform:uppercase;color:#0F6E56;margin-top:20px}
</style>
</head>
