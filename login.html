<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — PeerFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20173%20171%22%20fill%3D%22%231D9E75%22%3E%3Crect%20x%3D%2279%22%20y%3D%220%22%20width%3D%2213%22%20height%3D%2215%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2281%22%20width%3D%2215%22%20height%3D%2213%22%2F%3E%3Crect%20x%3D%22158%22%20y%3D%2281%22%20width%3D%2214%22%20height%3D%2213%22%2F%3E%3Crect%20x%3D%2279%22%20y%3D%22156%22%20width%3D%2213%22%20height%3D%2215%22%2F%3E%3Cpath%20d%3D%22M52%2024H116V39H99V56H83V70H67V39H52Z%22%2F%3E%3Cpath%20d%3D%22M24%2057H39V74H56V89H70V106H39V121H24Z%22%2F%3E%3Cpath%20d%3D%22M134%2053H149V118H134V101H117V85H103V69H134Z%22%2F%3E%3Cpath%20d%3D%22M119%20147H55V132H72V115H88V101H104V132H119Z%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://ooolpkdqrfhnmcmdqhau.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking the first paint: text appears immediately in the
     fallback face and swaps when the webfont lands. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"></noscript>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="index.html" aria-label="PeerFlow home">
      <svg width="26" height="26" viewBox="0 0 173 171" fill="currentColor" aria-hidden="true"><rect x="79" y="0" width="13" height="15"/><rect x="0" y="81" width="15" height="13"/><rect x="158" y="81" width="14" height="13"/><rect x="79" y="156" width="13" height="15"/><path d="M52 24H116V39H99V56H83V70H67V39H52Z"/><path d="M24 57H39V74H56V89H70V106H39V121H24Z"/><path d="M134 53H149V118H134V101H117V85H103V69H134Z"/><path d="M119 147H55V132H72V115H88V101H104V132H119Z"/></svg>
      <span>peer<b>flow</b></span>
    </a>
    <div class="nav-right">
      <span class="nav-note">New here?</span>
      <a class="login" href="signup.html">Sign up</a>
    </div>
  </div>
</header>

<main class="auth-page">
  <h1>Welcome back!</h1>
  <p class="lead">Sign into your account</p>

  <!-- One banner for every failed attempt. Deliberately does not say which
       of the two was wrong: telling someone the email exists but the
       password doesn't turns the form into an account checker. -->
  <p class="auth-alert" id="li-alert" role="alert" hidden>
    <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="10" cy="10" r="9" fill="#D92D20"/>
      <path d="M10 5.4v5.2M10 13.6v.6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>Uh-oh! Your email or password is incorrect.</span>
  </p>

  <div class="auth-btns">
    <button class="auth-btn" id="btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8a4.1 4.1 0 01-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z" fill="#4285F4"/><path d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.9.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 009 18z" fill="#34A853"/><path d="M3.9 10.7a5.4 5.4 0 010-3.4V5H.9a9 9 0 000 8l3-2.3z" fill="#FBBC05"/><path d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 00.9 5l3 2.3C4.6 5.1 6.6 3.6 9 3.6z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <button class="auth-btn" id="btn-github">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 014 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      Continue with GitHub
    </button>
  </div>

  <div class="divider">or with email</div>

  <div class="field" id="f-email">
    <label for="li-email">Email</label>
    <input id="li-email" type="email" placeholder="you@university.edu" autocomplete="email">
  </div>
  <div class="field" id="f-pass">
    <label for="li-pass">Password</label>
    <div class="pw-wrap">
      <input id="li-pass" type="password" placeholder="Your password" autocomplete="current-password">
      <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">Show</button>
    </div>
    <button type="button" class="forgot" id="forgot">Forgot password?</button>
    <div class="forgot-box" id="forgot-box" hidden>
      <p>We'll email you a link to set a new one. Put the address you signed up
        with in the email box above, then press send.</p>
      <button type="button" class="btn ghost small-btn" id="forgot-send">Send reset link</button>
      <p class="forgot-said" id="forgot-said" hidden></p>
    </div>
  </div>

  <div class="stack">
    <button class="btn big wide" id="login">Log in</button>
  </div>
  <p class="swap">New here? <a href="signup.html">Sign up</a></p>

  <p id="li-status" class="form-status"></p>
  <p class="onb-note">Email and Google sign-in are live.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/db.js"></script>
<script>
(function(){
  function enter(account){
    try {
      if (account && account.name) localStorage.setItem('pf_name', account.name);
      if (account && account.email) localStorage.setItem('pf_email', account.email);
    } catch(err) {}
    window.location.href = dest();
  }

  /* Where to land afterwards. authgate.js puts the page you were trying to
     reach in ?next=, so logging in takes you there rather than dumping you
     on the dashboard. Only same-site paths are accepted — an absolute URL
     here would be an open redirect. */
  function dest(){
    var next = '';
    try { next = new URLSearchParams(location.search).get('next') || ''; } catch(e){}
    return /^[A-Za-z0-9_.-]+\.html(\?[^#]*)?$/.test(next) ? next : 'app.html';
  }

  /* Already signed in? There's nothing to log into. Straight through. */
  pf.currentUser().then(function(user){
    if (user) window.location.replace(dest());
  });

  function social(provider){
    var s = document.getElementById('li-status');
    if (!pf.ready()) { s.textContent = 'Sign-in is temporarily unavailable — check your connection and try again.'; s.style.display='block'; return; }
    pf.signInOAuth(provider, dest()).then(function(res){
      if (res.redirecting) return;                   // browser navigates to the provider
      s.textContent = res.error || ('Could not reach ' + provider + ' sign-in. Please try again.');
      s.style.display = 'block';
    });
  }
  document.getElementById('btn-google').addEventListener('click', function(){ social('Google'); });
  document.getElementById('btn-github').addEventListener('click', function(){ social('GitHub'); });

  /* Hide provider buttons not enabled in Supabase (live site only). */
  if (location.protocol !== 'file:') {
    var cfg = window.PF_SUPABASE || {};
    if (cfg.enableGoogle === false) { var bg = document.getElementById('btn-google'); if (bg) bg.style.display = 'none'; }
    if (cfg.enableGithub === false) { var bh = document.getElementById('btn-github'); if (bh) bh.style.display = 'none'; }
  }

  var mailF = document.getElementById('f-email'), mailI = document.getElementById('li-email');
  var passF = document.getElementById('f-pass'), passI = document.getElementById('li-pass');
  var status = document.getElementById('li-status');
  var loginBtn = document.getElementById('login');
  var alertBox = document.getElementById('li-alert');

  /* One failure state for the whole form: clear both fields, show the
     banner, put the cursor back in the email box. */
  function fail(){
    mailI.value = '';
    passI.value = '';
    mailF.classList.remove('bad');
    passF.classList.remove('bad');
    alertBox.hidden = false;
    status.style.display = 'none';
    mailI.focus();
    try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e){ window.scrollTo(0, 0); }
  }
  [ [mailF,mailI], [passF,passI] ].forEach(function(p){
    p[1].addEventListener('input', function(){
      p[0].classList.remove('bad');
      status.style.display = 'none';
      alertBox.hidden = true;
    });
  });

  var forgotBtn = document.getElementById('forgot');
  var forgotBox = document.getElementById('forgot-box');
  var forgotSaid = document.getElementById('forgot-said');
  forgotBtn.addEventListener('click', function(){
    forgotBox.hidden = !forgotBox.hidden;
    if (!forgotBox.hidden && !mailI.value.trim()) mailI.focus();
  });

  document.getElementById('forgot-send').addEventListener('click', function(){
    var addr = mailI.value.trim();
    forgotSaid.hidden = false;
    forgotSaid.className = 'forgot-said';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(addr)) {
      forgotSaid.textContent = 'Put your email address in the box above first.';
      mailI.focus();
      return;
    }
    var btn = this;
    btn.disabled = true; btn.textContent = 'Sending\u2026';
    forgotSaid.hidden = true;
    pf.sendPasswordReset(addr).then(function(res){
      btn.disabled = false; btn.textContent = 'Send reset link';
      forgotSaid.hidden = false;
      if (res && res.sent) {
        /* Said the same way for an address with no account, on purpose. */
        forgotSaid.className = 'forgot-said ok';
        forgotSaid.textContent = 'If there is an account for ' + addr +
          ', a link is on its way. It expires in an hour.';
        return;
      }
      forgotSaid.textContent = (res && res.error) ||
        (res && res.demo ? 'Password reset isn\u2019t available right now.'
                         : 'Could not send that \u2014 please try again.');
    });
  });

  document.getElementById('pw-toggle').addEventListener('click', function(){
    var showing = passI.type === 'text';
    passI.type = showing ? 'password' : 'text';
    this.textContent = showing ? 'Show' : 'Hide';
  });

  loginBtn.addEventListener('click', function(){
    /* A malformed address and a wrong password get the same answer. Saying
       "that isn't an email" is a different message from "wrong password",
       and the difference is enough to tell someone which addresses exist. */
    var ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mailI.value.trim()) && !!passI.value;
    if (!ok) { fail(); return; }
    alertBox.hidden = true;
    status.style.display = 'none';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in…';
    pf.signInEmail(mailI.value.trim(), passI.value).then(function(res){
      loginBtn.disabled = false;
      loginBtn.textContent = 'Log in';
      if (res.error) {
        /* db.js collapses a wrong password and an unknown address into this
           one sentence, and this is the banner that says it. Match on the
           text it actually returns — comparing against Supabase's raw
           "Invalid login credentials" stopped matching the moment those
           messages started being written by us instead of by Postgres. */
        if (/email or password is incorrect/i.test(res.error)) { fail(); return; }
        /* Anything else — rate limits, an unconfirmed address, the server
           being down — still needs saying, because "wrong password" would
           send someone round in circles. */
        status.textContent = res.error;
        status.style.display = 'block';
        return;
      }
      var name = '';
      if (res.user) {
        name = (res.user.user_metadata && res.user.user_metadata.name) || '';
      }
      var existing = '';
      try { existing = localStorage.getItem('pf_name') || ''; } catch(err) {}
      enter({ name: name || existing || mailI.value.trim().split('@')[0], email: mailI.value.trim() });
    });
  });
})();
</script>
</body>
</html>
