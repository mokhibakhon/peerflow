<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How it works — source for the step pictures</title>
<link rel="stylesheet" href="app.css">
<style>
  /* These render to assets/how-1-find.png and assets/how-2-time.png.
     They sit in a 322px-wide card on the landing page, which is a quarter of
     this canvas — so everything is drawn about four times the size it will be
     read at, and carries roughly a fifth of what the real screen does. A
     faithful screenshot is a grey blur at that width; this has to land in one
     glance or it isn't doing anything. */
  body{margin:0;background:#fff;font-family:var(--body)}

  .frame{width:1280px;height:841px;background:#fff;border:1px solid #E7E6EC;
    border-radius:15px;overflow:hidden;display:flex;flex-direction:column;margin:0 0 40px}

  /* A slimmer version of the bar on the video-call frame. At final size it
     reads as window chrome, which is the whole job. */
  .fbar{height:96px;flex:0 0 auto;border-bottom:1px solid #EFEEF2;
    display:flex;align-items:center;padding:0 34px;position:relative}
  .fbrand{display:flex;align-items:center;gap:12px}
  .fbrand b{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
  .fbrand .g{color:#12A97C}
  .fpill{position:absolute;left:50%;transform:translateX(-50%);display:inline-flex;
    align-items:center;gap:11px;background:#DFF4EC;color:#0F6E56;font-family:var(--mono);
    font-size:22px;padding:11px 24px;border-radius:999px}
  .fpill i{width:9px;height:9px;border-radius:50%;background:#1D9E75;display:block}
  .fbody{flex:1;min-height:0;display:flex;flex-direction:column}

  /* ---------- 1. three people, three buttons ---------- */
  .prow{display:flex;align-items:center;gap:28px;padding:0 40px;flex:1;
    border-top:1px solid #F1F0F4}
  .prow:first-child{border-top:0}
  .pav{width:88px;height:88px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    font-size:36px;font-weight:800}
  .pwho{flex:1;min-width:0}
  .pnm{display:block;font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .psub{display:block;font-size:30px;color:#9497A9;margin-top:6px}
  .pbtn,.pdone{flex:0 0 auto;height:80px;border-radius:16px;display:inline-flex;
    align-items:center;gap:14px;padding:0 34px;font-size:34px;font-weight:700;
    letter-spacing:-.01em;white-space:nowrap}
  .pbtn{border:0;color:#fff;background:linear-gradient(180deg,#1D9E75,#0F6E56);
    box-shadow:0 3px 7px rgba(8,80,65,.24), inset 0 2px 0 rgba(255,255,255,.2)}
  .pdone{border:2px solid #E7E6EC;background:#FBFBFC;color:#82869C}
  .pbtn svg,.pdone svg{width:32px;height:32px;flex:0 0 auto}

  /* ---------- 2. the exchange ----------
     Agreeing a time is a conversation, so the picture is one. The question
     takes the ink from the nav button and the answer the pale green, which
     puts the weight of the card on the yes — that is the half of the exchange
     the step is actually named after. */
  .thread{width:100%;max-width:940px;display:flex;flex-direction:column;gap:40px;
    margin:0 auto}
  .line{display:flex;align-items:flex-end;gap:20px}
  .line.mine{flex-direction:row-reverse}
  .av{width:88px;height:88px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    font-size:34px;font-weight:800}
  .b{padding:32px 40px;border-radius:36px;font-size:46px;font-weight:600;
    letter-spacing:-.02em;line-height:1.25;max-width:640px}
  .b.me{background:#171A2E;color:#fff;border-bottom-right-radius:12px;
    box-shadow:0 8px 22px rgba(23,26,46,.24)}
  .b.them{background:#DFF0EA;color:#0A4A3B;border-bottom-left-radius:12px}
  .tick{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;
    background:#1D9E75;vertical-align:-11px;margin-left:14px}
  .tick svg{width:26px;height:26px}
  .tbody{flex:1;display:flex;align-items:center;justify-content:center;padding:0 44px}

</style>
</head>
<body>

<!-- ============ 1. find someone ============ -->
<div class="frame" id="f-find">
  <div class="fbar">
    <span class="fbrand">
      <svg width="32" height="32" viewBox="0 0 173 171" fill="#0b8f66"><rect x="79" y="0" width="13" height="15"/><rect x="0" y="81" width="15" height="13"/><rect x="158" y="81" width="14" height="13"/><rect x="79" y="156" width="13" height="15"/><path d="M52 24H116V39H99V56H83V70H67V39H52Z"/><path d="M24 57H39V74H56V89H70V106H39V121H24Z"/><path d="M134 53H149V118H134V101H117V85H103V69H134Z"/><path d="M119 147H55V132H72V115H88V101H104V132H119Z"/></svg>
      <b>peer<span class="g">flow</span></b>
    </span>
    <span class="fpill"><i></i>Linux basics</span>
  </div>
  <div class="fbody">
    <div class="prow">
      <span class="pav" style="background:#E1F5EE;color:#0F6E56">S</span>
      <span class="pwho"><span class="pnm">Sandra</span><span class="psub">Linux basics</span></span>
      <span class="pbtn">
        <svg viewBox="0 0 16 16" fill="none"><path d="M14 2L7 9M14 2l-4.6 12-2.4-5-5-2.4L14 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Send request</span>
    </div>
    <div class="prow">
      <span class="pav" style="background:#EEEDFE;color:#3C3489">A</span>
      <span class="pwho"><span class="pnm">Amir</span><span class="psub">Linux basics</span></span>
      <span class="pdone">
        <svg viewBox="0 0 16 16" fill="none"><path d="M14 2L7 9M14 2l-4.6 12-2.4-5-5-2.4L14 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Asked</span>
    </div>
    <div class="prow">
      <span class="pav" style="background:#FDEEE6;color:#B4471F">D</span>
      <span class="pwho"><span class="pnm">Dilnoza</span><span class="psub">Web app security</span></span>
      <span class="pbtn">
        <svg viewBox="0 0 16 16" fill="none"><path d="M14 2L7 9M14 2l-4.6 12-2.4-5-5-2.4L14 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Send request</span>
    </div>
  </div>
</div>

<!-- ============ 2. agree a time ============ -->
<div class="frame" id="f-time">
  <div class="fbar">
    <span class="fbrand">
      <svg width="32" height="32" viewBox="0 0 173 171" fill="#0b8f66"><rect x="79" y="0" width="13" height="15"/><rect x="0" y="81" width="15" height="13"/><rect x="158" y="81" width="14" height="13"/><rect x="79" y="156" width="13" height="15"/><path d="M52 24H116V39H99V56H83V70H67V39H52Z"/><path d="M24 57H39V74H56V89H70V106H39V121H24Z"/><path d="M134 53H149V118H134V101H117V85H103V69H134Z"/><path d="M119 147H55V132H72V115H88V101H104V132H119Z"/></svg>
      <b>peer<span class="g">flow</span></b>
    </span>
    <span class="fpill"><i></i>Linux basics</span>
  </div>
  <div class="fbody">
    <div class="tbody">
      <div class="thread">
        <div class="line mine">
          <span class="av" style="background:#EEEDFE;color:#3C3489">Y</span>
          <span class="b me">Tuesday at 7pm?</span>
        </div>
        <div class="line">
          <span class="av" style="background:#E1F5EE;color:#0F6E56">S</span>
          <span class="b them">Works for me<span class="tick"><svg viewBox="0 0 16 16" fill="none"><path d="M3.4 8.4l3 3.1L12.8 4.9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
