<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — PeerFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20173%20171%22%20fill%3D%22%230b8f66%22%3E%3Crect%20x%3D%2279%22%20y%3D%220%22%20width%3D%2213%22%20height%3D%2215%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2281%22%20width%3D%2215%22%20height%3D%2213%22%2F%3E%3Crect%20x%3D%22158%22%20y%3D%2281%22%20width%3D%2214%22%20height%3D%2213%22%2F%3E%3Crect%20x%3D%2279%22%20y%3D%22156%22%20width%3D%2213%22%20height%3D%2215%22%2F%3E%3Cpath%20d%3D%22M52%2024H116V39H99V56H83V70H67V39H52Z%22%2F%3E%3Cpath%20d%3D%22M24%2057H39V74H56V89H70V106H39V121H24Z%22%2F%3E%3Cpath%20d%3D%22M134%2053H149V118H134V101H117V85H103V69H134Z%22%2F%3E%3Cpath%20d%3D%22M119%20147H55V132H72V115H88V101H104V132H119Z%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="index.html" aria-label="PeerFlow home">
      <svg width="30" height="30" viewBox="0 0 173 171" fill="#0b8f66" aria-hidden="true"><rect x="79" y="0" width="13" height="15"/><rect x="0" y="81" width="15" height="13"/><rect x="158" y="81" width="14" height="13"/><rect x="79" y="156" width="13" height="15"/><path d="M52 24H116V39H99V56H83V70H67V39H52Z"/><path d="M24 57H39V74H56V89H70V106H39V121H24Z"/><path d="M134 53H149V118H134V101H117V85H103V69H134Z"/><path d="M119 147H55V132H72V115H88V101H104V132H119Z"/></svg>
      <span>peer<b>flow</b></span>
    </a>
    <div class="nav-right">
      <span style="font-size:14.5px;color:var(--muted)">New here?</span>
      <a class="login" href="signup.html">Sign up</a>
    </div>
  </div>
</header>

<main class="auth-page">
  <h1>Welcome back</h1>
  <p class="lead">Pick up where you left off.</p>

  <div class="auth-btns">
    <button class="auth-btn" id="btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8a4.1 4.1 0 01-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z" fill="#4285F4"/><path d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.9.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 009 18z" fill="#34A853"/><path d="M3.9 10.7a5.4 5.4 0 010-3.4V5H.9a9 9 0 000 8l3-2.3z" fill="#FBBC05"/><path d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 00.9 5l3 2.3C4.6 5.1 6.6 3.6 9 3.6z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <button class="auth-btn" id="btn-github">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="#21323b" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 014 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      Continue with GitHub
    </button>
  </div>

  <div class="divider">or with email</div>

  <div class="field" id="f-email">
    <label for="li-email">Email</label>
    <input id="li-email" type="email" placeholder="you@university.edu" autocomplete="email">
    <span class="err">That doesn't look like an email address — check for typos.</span>
  </div>
  <div class="field" id="f-pass">
    <label for="li-pass">Password</label>
    <div class="pw-wrap">
      <input id="li-pass" type="password" placeholder="Your password" autocomplete="current-password">
      <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">Show</button>
    </div>
    <span class="err">Please enter your password.</span>
  </div>

  <div style="margin-top:22px">
    <button class="btn primary big" id="login" style="width:100%">Log in</button>
  </div>
  <p class="swap">Forgot your password? <span style="color:var(--muted)">password reset is coming soon</span> · New here? <a href="signup.html">Sign up</a></p>

  <p id="li-status" style="display:none;font-size:13.5px;color:#c0392b;margin-top:14px"></p>
  <p class="onb-note">Email and Google sign-in are live.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/db.js"></script>
<script>
(function(){
  function enter(account){
    try {
      if (account && account.name) localStorage.setItem('pf_name', account.name);
      if (account && account.email) localStorage.setItem('pf_email', account.email);
    } catch(err) {}
    window.location.href = 'app.html';
  }

  /* Already signed in? There's nothing to log into. Straight through. */
  pf.currentUser().then(function(user){
    if (user) window.location.replace('app.html');
  });

  function social(provider){
    var s = document.getElementById('li-status');
    if (!pf.ready()) { s.textContent = 'Sign-in is temporarily unavailable — check your connection and try again.'; s.style.display='block'; return; }
    pf.signInOAuth(provider, 'app.html').then(function(res){
      if (res.redirecting) return;                   // browser navigates to the provider
      s.textContent = res.error || ('Could not reach ' + provider + ' sign-in. Please try again.');
      s.style.display = 'block';
    });
  }
  document.getElementById('btn-google').addEventListener('click', function(){ social('Google'); });
  document.getElementById('btn-github').addEventListener('click', function(){ social('GitHub'); });

  /* Hide provider buttons not enabled in Supabase (live site only). */
  if (location.protocol !== 'file:') {
    var cfg = window.PF_SUPABASE || {};
    if (cfg.enableGoogle === false) { var bg = document.getElementById('btn-google'); if (bg) bg.style.display = 'none'; }
    if (cfg.enableGithub === false) { var bh = document.getElementById('btn-github'); if (bh) bh.style.display = 'none'; }
  }

  var mailF = document.getElementById('f-email'), mailI = document.getElementById('li-email');
  var passF = document.getElementById('f-pass'), passI = document.getElementById('li-pass');
  var status = document.getElementById('li-status');
  var loginBtn = document.getElementById('login');
  [ [mailF,mailI], [passF,passI] ].forEach(function(p){
    p[1].addEventListener('input', function(){ p[0].classList.remove('bad'); status.style.display='none'; });
  });

  document.getElementById('pw-toggle').addEventListener('click', function(){
    var showing = passI.type === 'text';
    passI.type = showing ? 'password' : 'text';
    this.textContent = showing ? 'Show' : 'Hide';
  });

  loginBtn.addEventListener('click', function(){
    var ok = true;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mailI.value.trim())) { mailF.classList.add('bad'); ok = false; }
    if (!passI.value) { passF.classList.add('bad'); ok = false; }
    if (!ok) return;
    status.style.display = 'none';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in…';
    pf.signInEmail(mailI.value.trim(), passI.value).then(function(res){
      loginBtn.disabled = false;
      loginBtn.textContent = 'Log in';
      if (res.error) {
        status.textContent = res.error === 'Invalid login credentials'
          ? 'Wrong email or password — try again, or reset your password.'
          : res.error;
        status.style.display = 'block';
        return;
      }
      var name = '';
      if (res.user) {
        name = (res.user.user_metadata && res.user.user_metadata.name) || '';
      }
      var existing = '';
      try { existing = localStorage.getItem('pf_name') || ''; } catch(err) {}
      enter({ name: name || existing || mailI.value.trim().split('@')[0], email: mailI.value.trim() });
    });
  });
})();
</script>
</body>
</html>
