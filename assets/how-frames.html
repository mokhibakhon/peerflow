<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How it works — source for the step pictures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<!-- tokens.css first, and it is not optional: this file sets
     body{font-family:var(--body)} and --body is declared there, not in
     app.css. Without it the declaration is invalid at computed-value time,
     which does not fall back to app.css's font — it falls back to the
     browser default, and every picture ever rendered from this file came
     out in a serif. dev/seo-tests.js has a check for exactly this, but it walks the
     .html files in the repo root and this one lives in assets/, so nothing
     was watching. dev/how-frames-render.js now refuses to write a picture
     whose text is not actually set in Plus Jakarta Sans. -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
  /* The first frame renders to assets/how-1-find.png. The second one used to
     render to assets/how-2-time.png; the landing page dropped that step and
     the file went with it, but the frame is kept here so the picture can be
     re-made if the step comes back.
     They sit in a 322px-wide card on the landing page, which is a quarter of
     this canvas — so everything is drawn about four times the size it will be
     read at, and carries roughly a fifth of what the real screen does. A
     faithful screenshot is a grey blur at that width; this has to land in one
     glance or it isn't doing anything. */
  body{margin:0;background:#fff;font-family:var(--body)}

  .frame{width:1280px;height:841px;background:#fff;border:1px solid #E7E6EC;
    border-radius:15px;overflow:hidden;display:flex;flex-direction:column;margin:0 0 40px}

  /* The bar, in the same green as the buttons below it. At final size it is a
     band of colour across the top of the card, which is what tells the two
     drawn frames apart from the photograph in step three. */
  .fbar{height:96px;flex:0 0 auto;background:#0F6E56;
    display:flex;align-items:center;padding:0 34px}
  .fbrand{display:flex;align-items:center;gap:12px}
  .fbrand svg{fill:#fff}
  .fbrand b{font-size:30px;font-weight:800;letter-spacing:-.03em;color:#fff}
  .fbrand .g{color:#9FE1CB}
  .fbody{flex:1;min-height:0;display:flex;flex-direction:column}

  /* ---------- 1. the directory ----------
     This used to be three names and three buttons and nothing else — just
     "Sandra" and a green button. It said a list exists. It did not say what
     the list knows about anybody on it, which is the only reason to look at
     one.

     Each row is now a person and their learning path: Mobile, Frontend,
     Backend. That is the taxonomy the whole site is built on, it is three
     words rather than three sentences, and it reads at card size in a way a
     goal like "Networking fundamentals" does not.

     WHAT WAS TRIED AND DROPPED

     A SAME PATH tag on the matching row. It made the same point twice — every
     row names a path, and the caption beside the card is where "matched to
     yours" is said — and it was the widest thing in the person column.

     A goal on a second line under each name, with the path in the middle
     column. It carries more, and it is what the caption's "a similar goal"
     literally promises, but it puts two lines on every row and the second one
     lands at about 6px on the card. Both versions were rendered into a real
     card on /draft and compared there; this is the one that won.

     THE TWO COLUMNS ARE EQUAL ON PURPOSE

     flex:1 1 0 on both, so the name and the path start at evenly spaced
     positions and the button closes the row. They were 240px and
     whatever-was-left before, which put a small gap between name and path and
     a large one between path and button — three columns that did not look
     like three columns.

     SIZES ARE FOR THE CARD, NOT FOR THIS CANVAS

     At about 300px on the landing page everything here is read at roughly a
     quarter of the number in this block, so 44px reads as 11 and 26px reads as
     6.5, which is the floor. Nothing smaller than 26px is allowed in, and the
     column labels a real table would have are left out for the same reason: at
     2.5px they are grey mush, and the green bar already says what this is. */
  .prow{display:flex;align-items:center;gap:26px;padding:0 38px;flex:1;
    border-top:1px solid #F1F0F4}
  .prow:first-child{border-top:0}
  /* A rounded square rather than the circle this frame used to draw: it is
     what the app itself draws, and at card size the flat sides are what
     separate an avatar from a status dot. */
  .pav{width:84px;height:84px;border-radius:23px;flex:0 0 auto;display:grid;place-items:center;
    font-size:36px;font-weight:800}
  .pwho{flex:1 1 0;min-width:0}
  .pnm{display:block;font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  /* The path, in the body colour and close to the button's size rather than
     as a grey subtitle: on this frame it is a column of its own, not a
     footnote under a name. */
  .pfocus{flex:1 1 0;min-width:0;font-size:34px;letter-spacing:-.01em;line-height:1.25}
  .pbtn{flex:0 0 auto;height:80px;border-radius:16px;display:inline-flex;
    align-items:center;gap:14px;padding:0 30px;font-size:32px;font-weight:700;
    letter-spacing:-.01em;white-space:nowrap;
    border:0;color:#fff;background:linear-gradient(180deg,#1D9E75,#0F6E56);
    box-shadow:0 3px 7px rgba(8,80,65,.24), inset 0 2px 0 rgba(255,255,255,.2)}
  .pbtn svg{width:30px;height:30px;flex:0 0 auto}

  /* ---------- 2. the exchange ----------
     Agreeing a time is a conversation, so the picture is one. The question
     takes the ink from the nav button and the answer the pale green, which
     puts the weight of the card on the yes — that is the half of the exchange
     the step is actually named after. */
  .thread{width:100%;max-width:940px;display:flex;flex-direction:column;gap:40px;
    margin:0 auto}
  .line{display:flex;align-items:flex-end;gap:20px}
  .line.mine{flex-direction:row-reverse}
  .av{width:88px;height:88px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    font-size:34px;font-weight:800}
  .b{padding:32px 40px;border-radius:36px;font-size:46px;font-weight:600;
    letter-spacing:-.02em;line-height:1.25;max-width:640px}
  .b.me{background:#171A2E;color:#fff;border-bottom-right-radius:12px;
    box-shadow:0 8px 22px rgba(23,26,46,.24)}
  .b.them{background:#DFF0EA;color:#0A4A3B;border-bottom-left-radius:12px}
  .tick{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;
    background:#1D9E75;vertical-align:-11px;margin-left:14px}
  .tick svg{width:26px;height:26px}
  .tbody{flex:1;display:flex;align-items:center;justify-content:center;padding:0 44px}

</style>
</head>
<body>

<!-- ============ 1. find someone ============
     Renders to assets/how-1-find.png, which is step two's picture on the
     landing page. Three rows rather than the People page's full list: the
     card is 322px wide and a fourth row would buy nothing a third does not
     already say. -->
<div class="frame" id="f-find">
  <div class="fbar">
    <span class="fbrand">
      <svg width="32" height="32" viewBox="0 0 173 171" fill="#0b8f66"><rect x="79" y="0" width="13" height="15"/><rect x="0" y="81" width="15" height="13"/><rect x="158" y="81" width="14" height="13"/><rect x="79" y="156" width="13" height="15"/><path d="M52 24H116V39H99V56H83V70H67V39H52Z"/><path d="M24 57H39V74H56V89H70V106H39V121H24Z"/><path d="M134 53H149V118H134V101H117V85H103V69H134Z"/><path d="M119 147H55V132H72V115H88V101H104V132H119Z"/></svg>
      <b>peer<span class="g">flow</span></b>
    </span>
  </div>
  <div class="fbody">
    <div class="prow">
      <span class="pav" style="background:#E1F5EE;color:#0F6E56">S</span>
      <span class="pwho"><span class="pnm">Sarah</span></span>
      <span class="pfocus">Mobile</span>
      <span class="pbtn">
        <svg viewBox="0 0 16 16" fill="none"><path d="M14 2L7 9M14 2l-4.6 12-2.4-5-5-2.4L14 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Send request</span>
    </div>
    <div class="prow">
      <span class="pav" style="background:#EEEDFE;color:#3C3489">J</span>
      <span class="pwho"><span class="pnm">John</span></span>
      <span class="pfocus">Frontend</span>
      <span class="pbtn">
        <svg viewBox="0 0 16 16" fill="none"><path d="M14 2L7 9M14 2l-4.6 12-2.4-5-5-2.4L14 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Send request</span>
    </div>
    <div class="prow">
      <span class="pav" style="background:#FDEEE6;color:#B4471F">S</span>
      <span class="pwho"><span class="pnm">Shahnoza</span></span>
      <span class="pfocus">Backend</span>
      <span class="pbtn">
        <svg viewBox="0 0 16 16" fill="none"><path d="M14 2L7 9M14 2l-4.6 12-2.4-5-5-2.4L14 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Send request</span>
    </div>
  </div>
</div>

<!-- ============ 2. agree a time ============ -->
<div class="frame" id="f-time">
  <div class="fbar">
    <span class="fbrand">
      <svg width="32" height="32" viewBox="0 0 173 171" fill="#0b8f66"><rect x="79" y="0" width="13" height="15"/><rect x="0" y="81" width="15" height="13"/><rect x="158" y="81" width="14" height="13"/><rect x="79" y="156" width="13" height="15"/><path d="M52 24H116V39H99V56H83V70H67V39H52Z"/><path d="M24 57H39V74H56V89H70V106H39V121H24Z"/><path d="M134 53H149V118H134V101H117V85H103V69H134Z"/><path d="M119 147H55V132H72V115H88V101H104V132H119Z"/></svg>
      <b>peer<span class="g">flow</span></b>
    </span>
  </div>
  <div class="fbody">
    <div class="tbody">
      <div class="thread">
        <div class="line mine">
          <span class="av" style="background:#EEEDFE;color:#3C3489">Y</span>
          <span class="b me">Tuesday at 7pm?</span>
        </div>
        <div class="line">
          <span class="av" style="background:#E1F5EE;color:#0F6E56">S</span>
          <span class="b them">Works for me<span class="tick"><svg viewBox="0 0 16 16" fill="none"><path d="M3.4 8.4l3 3.1L12.8 4.9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
