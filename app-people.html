<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="app.html" aria-label="PeerFlow — Sessions">
      <svg width="30" height="30" viewBox="0 0 173 171" fill="#18B48D" aria-hidden="true"><rect x="79" y="0" width="13" height="15"/><rect x="0" y="81" width="15" height="13"/><rect x="158" y="81" width="14" height="13"/><rect x="79" y="156" width="13" height="15"/><path d="M52 24H116V39H99V56H83V70H67V39H52Z"/><path d="M24 57H39V74H56V89H70V106H39V121H24Z"/><path d="M134 53H149V118H134V101H117V85H103V69H134Z"/><path d="M119 147H55V132H72V115H88V101H104V132H119Z"/></svg>
      <span>peer<b>flow</b></span>
    </a>
    <nav class="nav-links" aria-label="App">
      <a href="app.html">Sessions</a>
      <a href="app-sessions.html">My partner</a>
      <a href="app-people.html" class="active">People</a>
    </nav>
    <div class="nav-right">
    </div>
  </div>
</header>

<main class="app-main">
  <div class="wrap">
    <div class="app-head">
      <h1>People on PeerFlow</h1>
    </div>

    <p class="empty-hint" style="max-width:640px">
      Everyone who has signed up, newest first. This is the pool your partner comes from —
      no one here is made up.
    </p>

    <div class="stat-row" style="max-width:420px;background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:24px">
      <div class="stat"><b id="st-total">—</b><span>signed up</span></div>
      <div class="stat"><b id="st-same">—</b><span>on your topic</span></div>
    </div>

    <ul class="plist people-list" id="people">
      <li style="color:var(--muted);font-size:14px">Loading…</li>
    </ul>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/db.js"></script>
<script>
(function(){
  var name = '', myTopic = '';
  try {
    name = localStorage.getItem('pf_name') || '';
    myTopic = localStorage.getItem('pf_topic') || '';
  } catch(err) {}

  var pathLabel = { frontend:'Frontend', backend:'Backend', cybersecurity:'Cybersecurity', data:'Data & analytics', mobile:'Mobile', devops:'DevOps & cloud', aiml:'AI & ML', design:'UX/UI design' };
  var levelLabel = { new:'Just starting', tutorials:'Doing tutorials', jobprep:'Job-hunt prep', builder:'Builds projects' };
  var palette = ['#0b8f66','#3d8fd1','#8e6cc8','#d1793d','#c2568e','#5a9e6f'];

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function since(d){
    var days = Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
    if (isNaN(days)) return '';
    return days <= 0 ? 'joined today' : days === 1 ? 'joined yesterday' : 'joined ' + days + ' days ago';
  }

  var list = document.getElementById('people');

  /* What's already been asked, so nobody is offered a duplicate request. */
  var reqByUser = {};

  function actionFor(userId){
    var r = reqByUser[userId];
    if (!r) return '<button class="btn ghost ask" data-ask="' + esc(userId) + '">Ask to partner</button>';
    if (r.status === 'accepted') return '<span class="ask-state ok">Partners</span>';
    if (r.status === 'declined') return '<span class="ask-state">Declined</span>';
    return r.direction === 'out'
      ? '<span class="ask-state">Request sent</span>'
      : '<span class="ask-state">Asked you — check the bell</span>';
  }

  pf.myRequests().then(function(r){
    if (r) {
      r.outgoing.forEach(function(x){ reqByUser[x.to_user]   = { status: x.status, direction: 'out' }; });
      r.incoming.forEach(function(x){ reqByUser[x.from_user] = { status: x.status, direction: 'in'  }; });
    }
    return pf.fetchPeers(24);
  }).then(function(people){
    if (people === null) {
      list.innerHTML = '<li style="color:var(--muted);font-size:14px">Could not load people — check your connection and refresh.</li>';
      return;
    }
    if (!people.length) {
      list.innerHTML = '<li style="color:var(--muted);font-size:14px">' +
        'No one else has signed up yet — you’re first. That’s genuinely useful to know: ' +
        'share PeerFlow with one person learning the same thing and you’ve got your pair.</li>';
      return;
    }
    list.innerHTML = people.map(function(p, i){
      var nm = p.name || 'Someone';
      var meta = [pathLabel[p.track_id] || '', p.topic ? 'Learning ' + p.topic : '', levelLabel[p.level] || '', p.timezone || '', since(p.created_at)]
        .filter(Boolean).join(' · ');
      var same = myTopic && p.topic && p.topic.toLowerCase() === myTopic.toLowerCase();
      return '<li>' +
        '<span class="av" style="background:' + palette[i % palette.length] + '">' + esc(nm.trim().charAt(0).toUpperCase()) + '</span>' +
        '<span><b>' + esc(nm) + (same ? ' <span class="same-tag">same topic</span>' : '') + '</b>' +
        '<span>' + esc(meta) + '</span></span>' +
        actionFor(p.id) +
        '</li>';
    }).join('');
  });

  /* Send a request. */
  list.addEventListener('click', function(e){
    var btn = e.target.closest('[data-ask]');
    if (!btn) return;
    var id = btn.getAttribute('data-ask');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    pf.sendPartnerRequest(id, '').then(function(res){
      if (res && res.sent) {
        reqByUser[id] = { status: 'pending', direction: 'out' };
        btn.outerHTML = '<span class="ask-state">Request sent</span>';
        return;
      }
      btn.disabled = false;
      btn.textContent = 'Ask to partner';
      alert(res && res.demo
        ? 'You need to be signed in to send a request.'
        : (res && res.error) || 'Could not send the request — please try again.');
    });
  });

  pf.learnerStats(myTopic).then(function(s){
    if (!s) return;
    document.getElementById('st-total').textContent = s.total;
    document.getElementById('st-same').textContent = s.sameTopic;
  });
})();
</script>
<script src="assets/usermenu.js"></script>
<script src="assets/notify.js"></script>
</body>
</html>
