<body>

<main>
  <div class="wrap">
    <div class="app-head">
      <h1>Sessions</h1>
    </div>

    <p class="bk-status" id="se-status" hidden></p>

    <section class="se-sec">
      <h2>Upcoming</h2>
      <p class="lede">Agreed by both of you. The room opens fifteen minutes before.</p>
      <div class="se-list" id="se-upcoming" aria-live="polite">
        <p class="se-empty">Loading…</p>
      </div>
    </section>

    <section class="se-sec">
      <h2>Waiting for an answer</h2>
      <p class="lede">Nothing here is booked yet — a time counts only once both of you agree.</p>
      <div class="se-list" id="se-waiting"><p class="se-empty">Loading…</p></div>
    </section>

    <section class="se-sec">
      <h2>History</h2>
      <p class="lede">What already happened, most recent first.</p>
      <div class="se-list" id="se-history"><p class="se-empty">Loading…</p></div>
    </section>
  </div>
</main>

<div class="mfoot">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* PeerFlow — Sessions.

   Three lists, in the order they need attention: what is booked, what is
   waiting on somebody, and what already happened.

   All the answering goes through the existing SECURITY DEFINER functions, so
   a session accepted or cancelled by one person moves on both calendars. That
   is the bug this model exists to prevent, and nothing here bypasses it. */
(function(){
  var LATE_MS = 2 * 60 * 60 * 1000;
  var JOIN_MS = 15 * 60 * 1000;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function firstName(n){ return String(n || '').trim().split(/\s+/)[0] || 'your partner'; }

  function dateLabel(d){
    var day = new Date(d); day.setHours(0,0,0,0);
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.round((day - today) / 864e5);
    var time = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', hour12:false });
    if (diff === 0) return 'Today ' + time;
    if (diff === 1) return 'Tomorrow ' + time;
    if (diff === -1) return 'Yesterday ' + time;
    return d.toLocaleDateString([], { weekday:'short', day:'numeric', month:'short' }) + ' ' + time;
  }

  function say(msg, bad){
    var st = document.getElementById('se-status');
    st.hidden = false;
    st.textContent = msg;
    st.className = 'bk-status' + (bad ? ' bk-warn' : '');
    if (!bad) setTimeout(function(){ st.hidden = true; }, 4000);
  }

  function empty(box, title, body, cta){
    box.innerHTML = '<div class="se-empty"><b>' + esc(title) + '</b>' + esc(body) +
      (cta ? ' <a href="' + cta[1] + '" style="text-decoration:underline">' + esc(cta[0]) + '</a>' : '') +
      '</div>';
  }

  /* One row. `acts` is already-escaped markup from the caller. */
  function row(s, tag, acts){
    return '<div class="se-row" data-at="' + esc(s.startsAt.toISOString()) +
             '" data-room="' + esc(s.roomUrl || '') + '">' +
      '<div class="se-date">' + esc(dateLabel(s.startsAt)) + '</div>' +
      '<div class="se-what">' +
        '<b>' + esc(s.topic || 'Study session') + '</b>' +
        '<span>' + esc(firstName(s.partnerName)) + ' · ' + s.durationMin + ' min' +
          (s.goal ? ' · ' + esc(s.goal) : '') + '</span>' +
      '</div>' + (tag || '') +
      '<div class="se-acts">' + (acts || '') + '</div></div>';
  }

  function render(sessions){
    var now = Date.now();
    var up = [], waiting = [], past = [];

    sessions.forEach(function(s){
      var over = s.startsAt.getTime() + s.durationMin * 60000 <= now;
      if (s.status === 'proposed') { waiting.push(s); return; }
      if (s.status === 'confirmed' && !over) { up.push(s); return; }
      past.push(s);
    });
    past.sort(function(a, b){ return b.startsAt - a.startsAt; });

    /* ---------- upcoming ---------- */
    var boxUp = document.getElementById('se-upcoming');
    if (!up.length) {
      empty(boxUp, 'Nothing booked yet',
        'When you and your partner agree a time it appears here.',
        ['Propose a time', 'app-partner.html#schedule']);
    } else {
      boxUp.innerHTML = up.map(function(s){
        var joinable = now >= s.startsAt.getTime() - JOIN_MS;
        var tag = s.confirmedAt
          ? '<span class="se-tag ok">You confirmed</span>'
          : '<span class="se-tag">Not confirmed</span>';
        var acts = '';
        if (!s.confirmedAt) acts += '<button class="small" data-do="confirm">Confirm</button>';
        if (joinable) acts += '<a class="small" href="app-room.html?at=' +
          encodeURIComponent(s.startsAt.toISOString()) + '&room=' +
          encodeURIComponent(s.roomUrl || '') + '">Join</a>';
        acts += '<button class="small" data-do="cancel">Can’t attend</button>';
        return row(s, tag, acts);
      }).join('');
    }

    /* ---------- waiting ---------- */
    var boxW = document.getElementById('se-waiting');
    if (!waiting.length) {
      empty(boxW, 'No proposals open', 'Times you or your partner suggest will wait here until somebody answers.');
    } else {
      boxW.innerHTML = waiting.map(function(s){
        if (s.mine) {
          /* Yours. Nothing to answer — you can only take it back. */
          return row(s, '<span class="se-tag wait">Waiting for ' + esc(firstName(s.partnerName)) + '</span>',
            '<button class="small" data-do="withdraw">Withdraw</button>');
        }
        return row(s, '<span class="se-tag wait">Needs your answer</span>',
          '<button class="small" data-do="accept">Accept</button>' +
          '<a class="small" href="app-partner.html#schedule">Suggest another</a>' +
          '<button class="small" data-do="decline">Decline</button>');
      }).join('');
    }

    /* ---------- history ---------- */
    var boxH = document.getElementById('se-history');
    if (!past.length) {
      empty(boxH, 'Nothing here yet', 'Your first session will appear here after you study together.');
    } else {
      boxH.innerHTML = past.slice(0, 25).map(function(s){
        var tag, acts = '';
        if (s.status === 'completed') {
          tag = s.attended
            ? '<span class="se-tag ok">Completed</span>'
            : '<span class="se-tag off">You missed it</span>';
        } else if (s.status === 'cancelled') {
          var late = s.cancelledAt && (s.startsAt.getTime() - s.cancelledAt.getTime()) < LATE_MS;
          tag = '<span class="se-tag off">' +
                (s.cancelledByMe ? 'You cancelled' : 'Cancelled') +
                (late ? ' late' : ' early') + '</span>';
          acts = '<button class="small" data-do="clear">Clear</button>';
        } else if (s.status === 'declined') {
          tag = '<span class="se-tag off">Declined</span>';
          acts = '<button class="small" data-do="clear">Clear</button>';
        } else {
          /* Confirmed and the time has passed with nobody checking out. */
          tag = '<span class="se-tag off">No-show</span>';
        }
        return row(s, tag, acts);
      }).join('');
    }
  }

  /* ---------- answering ---------- */
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-do]');
    if (!b) return;
    var r = b.closest('.se-row');
    var at = r.getAttribute('data-at'), room = r.getAttribute('data-room');
    var what = b.getAttribute('data-do');
    var was = b.textContent;
    b.disabled = true; b.textContent = '…';

    function done(res, ok){
      if (res && res.error) { b.disabled = false; b.textContent = was; say(res.error, true); return; }
      if (res && res.demo) { b.disabled = false; b.textContent = was; say('Demo mode — nothing was saved.'); return; }
      say(ok);
      load();
    }

    if (what === 'accept')   return pf.acceptSession(at, room).then(function(x){ done(x, 'Booked. It’s on both calendars.'); });
    if (what === 'decline')  return pf.declineSession(at, room).then(function(x){ done(x, 'Turned down.'); });
    if (what === 'confirm')  return pf.confirmAttendance(at, room).then(function(x){ done(x, 'Confirmed.'); });
    if (what === 'cancel')   return pf.cancelBooked(at, room).then(function(x){ done(x, 'Cancelled — your partner has been told.'); });
    if (what === 'withdraw') return pf.cancelSession(at, room).then(function(x){ done(x, 'Withdrawn.'); });
    if (what === 'clear')    return pf.cancelSession(at, room).then(function(x){ done(x, 'Cleared.'); });
  });

  /* ---------- load ---------- */
  function load(){
    pf.fetchSessions().then(function(list){
      if (!list) {
        ['se-upcoming','se-waiting','se-history'].forEach(function(id){
          empty(document.getElementById(id), 'We couldn’t load your sessions',
            'Refresh the page to try again.');
        });
        return;
      }
      render(list);
    });
  }

  if (!window.pf || !pf.ready || !pf.ready()) {
    ['se-upcoming','se-waiting','se-history'].forEach(function(id){
      empty(document.getElementById(id), 'Demo mode',
        'Sessions are read from real rows, so there is nothing to preview without an account.');
    });
    return;
  }
  load();
})();
</script>
