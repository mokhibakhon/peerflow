<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>People — PeerFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20173%20171%22%20fill%3D%22%230b8f66%22%3E%3Crect%20x%3D%2279%22%20y%3D%220%22%20width%3D%2213%22%20height%3D%2215%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2281%22%20width%3D%2215%22%20height%3D%2213%22%2F%3E%3Crect%20x%3D%22158%22%20y%3D%2281%22%20width%3D%2214%22%20height%3D%2213%22%2F%3E%3Crect%20x%3D%2279%22%20y%3D%22156%22%20width%3D%2213%22%20height%3D%2215%22%2F%3E%3Cpath%20d%3D%22M52%2024H116V39H99V56H83V70H67V39H52Z%22%2F%3E%3Cpath%20d%3D%22M24%2057H39V74H56V89H70V106H39V121H24Z%22%2F%3E%3Cpath%20d%3D%22M134%2053H149V118H134V101H117V85H103V69H134Z%22%2F%3E%3Cpath%20d%3D%22M119%20147H55V132H72V115H88V101H104V132H119Z%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<main>
  <div class="wrap">
    <div class="app-head">
      <h1>People on PeerFlow</h1>
    </div>

    <p class="empty-hint" style="max-width:640px">
      Everyone who has signed up, newest first. This is the pool your partner comes from —
      no one here is made up.
    </p>

    <div class="stat-row">
      <div class="stat"><b id="st-total">—</b><span>signed up</span></div>
      <div class="stat"><b id="st-same">—</b><span>on your topic</span></div>
    </div>

    <div class="b room" id="people">
      <p class="n">Loading…</p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/db.js"></script>
<script src="assets/authgate.js"></script>
<script>
(function(){
  var name = '', myTopic = '';
  try {
    name = localStorage.getItem('pf_name') || '';
    myTopic = localStorage.getItem('pf_topic') || '';
  } catch(err) {}

  var pathLabel = { frontend:'Frontend', backend:'Backend', cybersecurity:'Cybersecurity', data:'Data & analytics', mobile:'Mobile', devops:'DevOps & cloud', aiml:'AI & ML', design:'UX/UI design' };
  var levelLabel = { new:'Just starting', tutorials:'Doing tutorials', jobprep:'Job-hunt prep', builder:'Builds projects' };
  /* Same tones as the account chip: a soft tint with a dark letter, keyed off
     the name so someone's avatar is stable wherever they appear. Solid
     saturated circles were shouting over the names next to them. */
  var TONES = [
    ['#EEEDFE','#3C3489'], ['#E1F5EE','#0F6E56'], ['#FBEAF0','#A94168'],
    ['#E6F1FB','#185FA5'], ['#FAEEDA','#854F0B'], ['#FAECE7','#993C1D'],
    ['#F5EAF8','#58256B'], ['#EDF0F3','#35414F']
  ];
  function tone(name){
    var str = String(name || '?'), h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return TONES[h % TONES.length];
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function since(d){
    var days = Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
    if (isNaN(days)) return '';
    return days <= 0 ? 'joined today' : days === 1 ? 'joined yesterday' : 'joined ' + days + ' days ago';
  }

  var list = document.getElementById('people');

  /* What's already been asked, so nobody is offered a duplicate request. */
  var reqByUser = {};

  function actionFor(userId){
    var r = reqByUser[userId];
    if (!r) return '<button class="small ask" data-ask="' + esc(userId) + '">Ask to partner</button>';
    if (r.status === 'accepted') return '<span class="ask-state ok">Partners</span>';
    if (r.status === 'declined') return '<span class="ask-state">Declined</span>';
    return r.direction === 'out'
      ? '<span class="ask-state">Request sent</span>'
      : '<span class="ask-state">Asked you — check the bell</span>';
  }

  pf.myRequests().then(function(r){
    if (r) {
      r.outgoing.forEach(function(x){ reqByUser[x.to_user]   = { status: x.status, direction: 'out' }; });
      r.incoming.forEach(function(x){ reqByUser[x.from_user] = { status: x.status, direction: 'in'  }; });
    }
    return pf.fetchPeers(24);
  }).then(function(people){
    if (people === null) {
      list.innerHTML = '<p class="n">Could not load people — check your connection and refresh.</p>';
      return;
    }
    if (!people.length) {
      list.innerHTML = '<p class="n">' +
        'No one else has signed up yet — you’re first. That’s genuinely useful to know: ' +
        'share PeerFlow with one person learning the same thing and you’ve got your pair.</li>';
      return;
    }
    list.innerHTML = people.map(function(p){
      var nm = p.name || 'Someone';
      var t = tone(nm);
      /* Two lines, not one run-on string: what they're learning is the thing
         you actually read, the rest is context. */
      var learning = p.topic ? 'Learning ' + p.topic : '';
      var meta = [pathLabel[p.track_id] || '', levelLabel[p.level] || '',
                  p.timezone || '', since(p.created_at)].filter(Boolean).join(' · ');
      var same = myTopic && p.topic && p.topic.toLowerCase() === myTopic.toLowerCase();
      return '<div class="r">' +
        '<span class="a" style="background:' + t[0] + ';color:' + t[1] + '">' +
          esc(nm.trim().charAt(0).toUpperCase()) + '</span>' +
        '<div class="b2">' +
          '<p class="nm">' + esc(nm) + (same ? '<span class="same-tag">same topic</span>' : '') + '</p>' +
          (learning ? '<p class="s">' + esc(learning) + '</p>' : '') +
          (meta ? '<p class="mt">' + esc(meta) + '</p>' : '') +
        '</div>' +
        actionFor(p.id) +
        '</div>';
    }).join('');
  });

  /* Send a request. */
  list.addEventListener('click', function(e){
    var btn = e.target.closest('[data-ask]');
    if (!btn) return;
    var id = btn.getAttribute('data-ask');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    pf.sendPartnerRequest(id, '').then(function(res){
      if (res && res.sent) {
        reqByUser[id] = { status: 'pending', direction: 'out' };
        btn.outerHTML = '<span class="ask-state">Request sent</span>';
        return;
      }
      btn.disabled = false;
      btn.textContent = 'Ask to partner';
      alert(res && res.demo
        ? 'You need to be signed in to send a request.'
        : (res && res.error) || 'Could not send the request — please try again.');
    });
  });

  pf.learnerStats(myTopic).then(function(s){
    if (!s) return;
    document.getElementById('st-total').textContent = s.total;
    document.getElementById('st-same').textContent = s.sameTopic;
  });
})();
</script>
<script src="assets/appshell.js"></script>
<script src="assets/usermenu.js"></script>
<script src="assets/notify.js"></script>
</body>
</html>
