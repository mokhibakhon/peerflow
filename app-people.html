<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>People — PeerFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20173%20171%22%20fill%3D%22%230b8f66%22%3E%3Crect%20x%3D%2279%22%20y%3D%220%22%20width%3D%2213%22%20height%3D%2215%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%2281%22%20width%3D%2215%22%20height%3D%2213%22%2F%3E%3Crect%20x%3D%22158%22%20y%3D%2281%22%20width%3D%2214%22%20height%3D%2213%22%2F%3E%3Crect%20x%3D%2279%22%20y%3D%22156%22%20width%3D%2213%22%20height%3D%2215%22%2F%3E%3Cpath%20d%3D%22M52%2024H116V39H99V56H83V70H67V39H52Z%22%2F%3E%3Cpath%20d%3D%22M24%2057H39V74H56V89H70V106H39V121H24Z%22%2F%3E%3Cpath%20d%3D%22M134%2053H149V118H134V101H117V85H103V69H134Z%22%2F%3E%3Cpath%20d%3D%22M119%20147H55V132H72V115H88V101H104V132H119Z%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://ooolpkdqrfhnmcmdqhau.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking the first paint: text appears immediately in the
     fallback face and swaps when the webfont lands. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"></noscript>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<main>
  <div class="wrap">
    <!-- The counts sit in the header rather than in two floating tiles below
         it. The header already had an empty right half, and two small numbers
         in their own boxes read as a dashboard this page is not. -->
    <div class="app-head">
      <h1>People on PeerFlow</h1>
      <dl class="figs">
        <div><dt>People here</dt><dd id="st-total">—</dd></div>
        <div><dt>On your path</dt><dd id="st-same">—</dd></div>
      </dl>
    </div>

    <p class="empty-hint">
      Everyone who has finished signing up. The person at the top is whoever is
      closest to what you're learning — a suggestion, not a match. Nobody here is
      made up, and you can ask anyone on the list instead.
    </p>

    <!-- Anyone who has asked you, above the directory and independent of it.
         This used to be a state chip on a search result, which meant a request
         was only visible if the sender happened to appear in your list. -->
    <section class="inbox" id="inbox" hidden>
      <p class="inbox-h"><span class="inbox-n" id="inbox-n">1</span><b id="inbox-t">Waiting on you</b></p>
      <div class="inbox-body">
        <div id="inbox-list"></div>
        <p class="inbox-sub" id="inbox-sub"></p>
      </div>
    </section>

    <div id="people">
      <div class="b"><p class="n">Loading…</p></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/db.js"></script>
<script src="assets/authgate.js"></script>
<script>
(function(){
  var name = '', myTopic = '';
  try {
    name = localStorage.getItem('pf_name') || '';
    myTopic = localStorage.getItem('pf_topic') || '';
  } catch(err) {}

  var pathLabel = { frontend:'Frontend', backend:'Backend', cybersecurity:'Cybersecurity', data:'Data & analytics', mobile:'Mobile', devops:'DevOps & cloud', aiml:'AI & ML', design:'UX/UI design' };
  var levelLabel = { new:'Just starting', tutorials:'Doing tutorials', jobprep:'Job-hunt prep', builder:'Builds projects' };
  /* Same tones as the account chip: a soft tint with a dark letter, keyed off
     the name so someone's avatar is stable wherever they appear. Solid
     saturated circles were shouting over the names next to them. */
  var TONES = [
    ['#EEEDFE','#3C3489'], ['#E1F5EE','#0F6E56'], ['#FBEAF0','#A94168'],
    ['#E6F1FB','#185FA5'], ['#FAEEDA','#854F0B'], ['#FAECE7','#993C1D'],
    ['#F5EAF8','#58256B'], ['#EDF0F3','#35414F']
  ];
  function tone(name){
    var str = String(name || '?'), h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return TONES[h % TONES.length];
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  var list = document.getElementById('people');

  /* What's already been asked, so nobody is offered a duplicate request. */
  var reqByUser = {};

  /* The right-hand slot is either the one action on this page or the state
     you're already in with that person. Button and chips are built to the
     same height and radius so the column stays straight as rows change
     state, and each chip carries a glyph so it reads at a glance. */
  var ICON = {
    tick: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 8.6l3 3L12.8 4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    sent: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14 2L7 9M14 2l-4.6 12-2.4-5-5-2.4L14 2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
    wait: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.6V8l2.4 1.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    no:   '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.6 5.6l4.8 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
  };
  function chip(kind, icon, label){
    return '<span class="pstate ' + kind + '">' + ICON[icon] + label + '</span>';
  }

  function actionFor(userId){
    var r = reqByUser[userId];
    if (!r) return '<button class="askbtn" data-ask="' + esc(userId) + '">Send request</button>';
    if (r.status === 'accepted') return chip('ok',   'tick', 'Partners');
    if (r.status === 'declined') return chip('no',   'no',   'Declined');
    return r.direction === 'out'
      ? chip('sent', 'sent', 'Asked')
      : chip('wait', 'wait', 'Waiting on you');
  }

  var me = { track: '', topic: myTopic, avail: [] };

  /* How many of the times you're free they are free too. This is the fact
     that decides whether a partnership can physically happen, so it goes
     on the row rather than being something you find out after asking. */
  function overlap(theirs){
    if (!me.avail.length || !theirs || !theirs.length) return 0;
    var mine = {}, n = 0;
    me.avail.forEach(function(s){ mine[s] = true; });
    theirs.forEach(function(s){ if (mine[s]) n++; });
    return n;
  }

  /* Why this person is worth your attention, strongest reason first. The
     ranking is the whole point of the page — a list in signup order buries
     the one person on your topic under everyone who joined after them. */
  function reason(p){
    if (me.topic && p.topic && p.topic.toLowerCase() === me.topic.toLowerCase()) return 'topic';
    if (me.track && p.track_id === me.track) return 'path';
    return '';
  }
  function score(p){
    var r = reason(p);
    return (r === 'topic' ? 200 : r === 'path' ? 100 : 0) + Math.min(overlap(p.availability), 20);
  }

  function initial(nm){ return esc(nm.trim().charAt(0).toUpperCase() || '?'); }

  /* Reliability, compressed to fit a row. Silent below the floor rather than
     showing "—": a dash in a column implies the number exists and is being
     withheld, when the truth is that nobody has enough sessions to have one. */
  var relBy = {};
  function relChip(id){
    var r = relBy[id];
    if (!r || r.pct === null || r.pct === undefined) return '';
    var band = r.pct >= 80 ? '' : r.pct >= 65 ? ' mid' : ' low';
    return '<span class="relchip' + band + '" title="' +
      esc(pf.reliabilityLabel(r.pct) + ' — ' + r.attended + ' attended, ' +
          r.noShows + ' missed') + '"><i></i>' + r.pct + '%</span>';
  }

  /* "3 blocks" is our word for a cell in the availability grid, not a
     reader's. The cell says the whole thing instead, so the column needs no
     decoding: "3 times you're both free". */
  function howMany(n){ return n === 1 ? '1 time' : n + ' times'; }
  function timesShort(p){
    if (!me.avail.length) return '';
    var n = overlap(p.availability);
    return n ? '<span class="overlap ok">' + howMany(n) + ' you\u2019re both free</span>'
             : '<span class="overlap none">No times in common</span>';
  }

  /* The top pick argues its case: the facts that made it the top pick sit on
     the card, so the suggestion is checkable rather than trust-me. */
  function heroCard(p){
    var nm = p.name || 'Someone', t = tone(nm), why = reason(p), shared = overlap(p.availability);
    var tag = why === 'topic' ? 'Closest to what you’re learning'
            : why === 'path'  ? 'Closest on your path'
                              : 'Free when you’re free';

    var facts = [];
    if (why === 'topic')     facts.push(['Same topic', p.topic]);
    else if (why === 'path') facts.push(['Same path', pathLabel[p.track_id] || '']);
    else if (p.topic)        facts.push(['Learning', p.topic]);
    if (me.avail.length) {
      facts.push(shared ? ['You’re both free', howMany(shared)]
                        : ['Times you’re both free', 'None yet']);
    }
    if (levelLabel[p.level]) facts.push(['Stage', levelLabel[p.level]]);
    if (p.timezone)          facts.push(['Timezone', p.timezone]);
    var rel = relBy[p.id];
    if (rel && rel.pct !== null && rel.pct !== undefined) {
      facts.push(['Turns up', rel.pct + '%']);
    }

    return '<div class="top-pick" data-id="' + esc(p.id) + '">' +
      '<p class="tp-tag">' + tag + '</p>' +
      '<div class="tp-top">' +
        '<span class="tp-av" style="background:' + t[0] + ';color:' + t[1] + '">' + initial(nm) + '</span>' +
        '<div><p class="tp-nm">' + esc(nm) + '</p><p class="tp-sub">' +
          (p.topic ? 'Learning ' + esc(p.topic) : 'Hasn’t said what they’re learning yet') +
        '</p></div>' +
      '</div>' +
      '<div class="tp-facts">' + facts.map(function(f){
        return '<div class="tp-fact"><b>' + esc(f[1]) + '</b><span>' + f[0] + '</span></div>';
      }).join('') + '</div>' +
      '<div class="tp-acts">' + actionFor(p.id) +
        '<a class="ghost" href="app-person.html?id=' + esc(p.id) + '">View profile</a>' +
      '</div>' +
    '</div>';
  }

  function tableRow(p){
    var nm = p.name || 'Someone', t = tone(nm), why = reason(p);
    var tags = why === 'topic' ? '<span class="same-tag">same topic</span>'
             : why === 'path'  ? '<span class="same-tag alt">same path</span>' : '';
    var sub = [pathLabel[p.track_id] || '', levelLabel[p.level] || '']
                .filter(Boolean).join(' \u00b7 ');

    /* The person block is the link. There used to be a "Profile" link at the
       end of the row as well, going to exactly where the name already went —
       the same word repeated down the page, saying nothing about anybody.
       Pressing the face or the name is where people reach anyway, and it
       leaves one thing to press per row rather than two. */
    return '<div class="pt-row" data-id="' + esc(p.id) + '">' +
      '<a class="pt-who" href="app-person.html?id=' + esc(p.id) + '">' +
        '<span class="pt-av" style="background:' + t[0] + ';color:' + t[1] + '">' + initial(nm) + '</span>' +
        '<div style="min-width:0"><div class="pt-nm">' +
          '<span class="pt-nm-t">' + esc(nm) + '</span>' + tags +
          relChip(p.id) + '</div>' +
        (sub ? '<div class="pt-sub">' + esc(sub) + '</div>'
             : '<div class="pt-sub">Still setting up</div>') + '</div>' +
      '</a>' +
      '<div class="pt-tp">' + (p.topic ? esc(p.topic) : '<span class="pt-sub">Not said yet</span>') + '</div>' +
      timesShort(p) +
      '<div class="pt-acts">' + actionFor(p.id) + '</div>' +
    '</div>';
  }

  function render(people){
    var ranked = people.slice().sort(function(x, y){ return score(y) - score(x); });

    /* Only lead with someone if there is a real reason to. Heroing whoever
       happens to be first, with nothing in common and no shared time, would
       be a recommendation the page cannot back up. Anyone already settled
       with you — partnered or declined — is not a suggestion either. */
    var hero = null;
    for (var i = 0; i < ranked.length; i++) {
      var st = (reqByUser[ranked[i].id] || {}).status;
      if (st === 'accepted' || st === 'declined') continue;
      if (score(ranked[i]) > 0) hero = ranked.splice(i, 1)[0];
      break;
    }

    var html = hero ? heroCard(hero) : '';
    if (ranked.length) {
      html += '<div class="ptable' + (me.avail.length ? '' : ' no-times') + '">' +
        '<div class="pt-hd"><span>Person</span><span>Learning</span>' +
        (me.avail.length ? '<span>Schedules</span>' : '') + '<span></span></div>' +
        ranked.map(tableRow).join('') +
      '</div>';
    }
    list.innerHTML = html;
  }

  /* Requests waiting on you, drawn from the requests rather than from the
     directory. The old code only ever set a chip on a matching row, so a
     request from somebody who had not picked a path — and therefore never
     appeared in fetchPeers() — arrived and was never seen by anybody. */
  function renderInbox(pending){
    if (!pending.length) return;
    var box = document.getElementById('inbox');
    /* The count is the number; the heading is the same three words however
       many there are. "3 people want to study with you" made the sentence
       carry a figure the badge beside it already shows. */
    document.getElementById('inbox-n').textContent = String(pending.length);
    document.getElementById('inbox-t').textContent = 'Waiting on you';
    /* One line. The two-sentence version was written to fill a panel that has
       gone, and the second half only ever mattered once you had decided. */
    document.getElementById('inbox-sub').textContent =
      'Accepting opens booking for the two of you. Declining is not rude.';

    document.getElementById('inbox-list').innerHTML = pending.map(function(x){
      var p = x.other || {}, nm = p.name || 'Someone', t = tone(nm);
      var sub = [pathLabel[p.track_id] || '', p.topic ? 'learning ' + p.topic : '']
                  .filter(Boolean).join(' · ');
      return '<div class="inreq" data-req="' + esc(x.id) + '">' +
        '<span class="inreq-av" style="background:' + t[0] + ';color:' + t[1] + '">' +
          initial(nm) + '</span>' +
        '<div class="inreq-b">' +
          '<p class="inreq-nm">' +
            '<a class="who" href="app-person.html?id=' + esc(p.id) + '">' + esc(nm) + '</a>' +
          '</p>' +
          /* A note used to be printed bare, so a sentence somebody wrote read
             as if the page were describing them. Saying whose words these are
             costs four words and removes the ambiguity — same size, same
             weight, same colour, so the line is still the quiet one. */
          '<p class="inreq-msg">' +
            (x.message
              ? 'Note from ' + esc(nm.trim().split(/\s+/)[0]) + ': ' + esc(x.message)
              : (sub || 'They haven’t said anything about themselves yet.')) +
          '</p>' +
        '</div>' +
        '<div class="inreq-acts">' +
          '<button class="btn" data-answer="accepted">Accept</button>' +
          '<button class="small" data-answer="declined">Decline</button>' +
        '</div>' +
      '</div>';
    }).join('');
    box.hidden = false;
  }

  document.getElementById('inbox-list').addEventListener('click', function(e){
    var btn = e.target.closest && e.target.closest('[data-answer]');
    if (!btn) return;
    var row = btn.closest('[data-req]');
    var id = row.getAttribute('data-req');
    var status = btn.getAttribute('data-answer');
    row.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
    btn.textContent = status === 'accepted' ? 'Accepting…' : 'Declining…';
    pf.respondToRequest(id, status).then(function(res){
      if (res && res.error) {
        row.querySelectorAll('button').forEach(function(b){ b.disabled = false; });
        btn.textContent = status === 'accepted' ? 'Accept' : 'Decline';
        var msg = row.querySelector('.inreq-msg');
        msg.textContent = res.error;
        return;
      }
      /* Reload rather than patch: saying yes changes the partner list, the
         directory row and the Partner page all at once, and re-deriving all
         three by hand here is how they drift apart. */
      location.reload();
    });
  });

  Promise.all([pf.myRequests(), pf.getProfile()]).then(function(r){
    var reqs = r[0], profile = r[1];
    if (reqs) {
      reqs.outgoing.forEach(function(x){ reqByUser[x.to_user]   = { status: x.status, direction: 'out' }; });
      reqs.incoming.forEach(function(x){ reqByUser[x.from_user] = { status: x.status, direction: 'in'  }; });
      renderInbox(reqs.incoming.filter(function(x){ return x.status === 'pending'; }));
      /* Now that they have been shown, they are not new any more. */
      if (pf.markRequestsSeen) {
        pf.markRequestsSeen(reqs.incoming.map(function(x){ return x.id; }), []);
      }
    }
    if (profile) {
      me.track = profile.track_id || '';
      me.topic = profile.topic || myTopic;
      me.avail = profile.availability || [];
    }
    return pf.fetchPeers(60);
  }).then(function(people){
    if (people === null) {
      list.innerHTML = '<div class="b"><p class="n">Could not load people — check your connection and refresh.</p></div>';
      return;
    }
    if (!people.length) {
      list.innerHTML = '<div class="b"><p class="n">' +
        'No one else has finished signing up yet — you’re first. That’s genuinely useful to know: ' +
        'share PeerFlow with one person learning the same thing and you’ve got your pair.</p></div>';
      return;
    }
    document.getElementById('st-total').textContent = people.length + 1;
    document.getElementById('st-same').textContent =
      me.track ? people.filter(function(p){ return p.track_id === me.track; }).length : 0;

    /* One call for the whole page, then draw once. Drawing without the scores
       and again with them would move every row a moment after paint. */
    if (!pf.reliabilityOf) { render(people); return; }
    return pf.reliabilityOf(people.map(function(p){ return p.id; })).then(function(by){
      relBy = by || {};
      render(people);
    });
  });

  /* Asking opens a one-line note first. sendPartnerRequest has always taken a
     message and always been given an empty one, so requests arrived as a bare
     name with nothing to say yes or no to. The note is optional — Send works
     empty — but a sentence about what you're stuck on is the difference
     between a request someone accepts and one they ignore. */
  list.addEventListener('click', function(e){
    var open = e.target.closest('[data-ask]');
    if (open) {
      var r = open.closest('[data-id]');
      var id = open.getAttribute('data-ask');
      open.replaceWith(document.createComment('asking'));
      var box = document.createElement('div');
      box.className = 'askbox';
      box.innerHTML =
        '<input type="text" maxlength="140" placeholder="Say what you\u2019re working on (optional)">' +
        /* Just "Send" — the row button is the one that says "Send request",
           and two buttons a centimetre apart carrying the same three words
           is a question about which one you are really pressing. */
        '<button class="btn" data-send="' + esc(id) + '">Send</button>' +
        '<button class="small" data-cancel>Cancel</button>' +
        '<p class="ask-err" hidden></p>';
      askSlot(r).appendChild(box);
      box.querySelector('input').focus();
      return;
    }

    var cancel = e.target.closest('[data-cancel]');
    if (cancel) { redraw(cancel.closest('[data-id]')); return; }

    var send = e.target.closest('[data-send]');
    if (!send) return;
    var uid = send.getAttribute('data-send');
    var wrap = send.closest('.askbox');
    var msg = wrap.querySelector('input').value.trim();
    var err = wrap.querySelector('.ask-err');
    send.disabled = true;
    send.textContent = 'Sending…';
    err.hidden = true;
    pf.sendPartnerRequest(uid, msg).then(function(res){
      if (res && res.sent) {
        reqByUser[uid] = { status: 'pending', direction: 'out' };
        redraw(send.closest('[data-id]'));
        return;
      }
      send.disabled = false;
      send.textContent = 'Send';
      err.textContent = res && res.demo
        ? 'You need to be signed in to send a request.'
        : (res && res.error) || 'Could not send the request — please try again.';
      err.hidden = false;
    });
  });

  /* Two different places, and treating them as one is what put "Asked" full
     width under somebody's name until the page was reloaded.

     The ask box wants the width of the whole row: on a table row it is a
     direct child, which `.pt-row .askbox` then spans across every column.
     The button, and the chip that replaces it, belong in the actions cell —
     which is where actionFor() puts them on a fresh render, and why a reload
     looked right when the click did not.

     This used to be one function returning `.tp-acts || r`. That is correct
     for the top pick, whose actions are in `.tp-acts`, and wrong for every
     table row, whose actions are in `.pt-acts` — so the chip was appended to
     the grid itself and landed in a new cell on a line of its own. */
  function askSlot(r){ return r.querySelector('.tp-acts') || r; }
  function actSlot(r){
    return r.querySelector('.tp-acts') || r.querySelector('.pt-acts') || r;
  }

  /* Put a row back to its resting state after sending or cancelling. Scoped
     to the row rather than to one slot, so the ask box is cleared wherever it
     was put and the chip is only ever added back in one place. */
  function redraw(r){
    if (!r) return;
    var box = r.querySelector('.askbox');
    if (box) box.remove();
    r.querySelectorAll('.pstate,[data-ask]').forEach(function(n){ n.remove(); });
    actSlot(r).insertAdjacentHTML('beforeend', actionFor(r.getAttribute('data-id')));
  }

})();
</script>
<script src="assets/appshell.js"></script>
<script src="assets/usermenu.js"></script>
<script src="assets/notify.js"></script>
</body>
</html>
