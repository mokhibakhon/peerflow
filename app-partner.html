<body>

<main>
  <div class="wrap">
    <div class="app-head">
      <h1>Your partner</h1>
    </div>

    <div id="pt-root" aria-live="polite">
      <div class="b"><p class="n">Loading…</p></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/db.js"></script>
<script src="assets/authgate.js"></script>

<script>
/* PeerFlow — the Partner page.

   One relationship, described once: who they are, how reliable the two of you
   have been, what you are working through, when you are both free, and why you
   were put together. Scheduling starts here because this is the only page that
   knows both people's availability.

   Nothing on this page invents anything. Sessions together, attendance and
   streaks are all counted from real session rows; the shared windows are the
   intersection of two saved availability lists. When there is no partner the
   page says what to do about it rather than showing an empty shell. */
(function(){
  var root = document.getElementById('pt-root');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  /* Same colour rule as the avatar in the header, so a person looks like the
     same person wherever they appear. */
  var TONES = [
    ['#EEEDFE','#3C3489'], ['#E1F5EE','#0F6E56'], ['#FBEAF0','#A94168'],
    ['#E6F1FB','#185FA5'], ['#FAEEDA','#854F0B'], ['#FAECE7','#993C1D'],
    ['#F5EAF8','#58256B'], ['#EDF0F3','#35414F']
  ];
  function tone(name){
    var s = String(name || '?'), h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return TONES[h % TONES.length];
  }
  function initial(name){ return (String(name || '').trim().charAt(0) || 'S').toUpperCase(); }

  var LEVEL = { 'new':'Just starting', tutorials:'Working through tutorials',
                builder:'Building things', jobprep:'Preparing for work' };

  /* ---------- the empty state ---------- */
  /* "No partner" is not a state anybody can act on. This one names the next
     step and links straight to it. */
  function renderNoPartner(){
    root.innerHTML =
      '<div class="pt-sec" style="text-align:left;max-width:640px">' +
        '<h3 style="font-size:19px">Find your study partner</h3>' +
        '<p class="lede">Tell us what you’re learning and when you’re free, and ' +
          'we’ll show you the people closest to it. One partner, not a group.</p>' +
        '<a class="btn" href="app-people.html">Find my partner</a>' +
      '</div>';
  }

  /* ---------- the page ---------- */
  function render(partner, profile, sessions, rel){
    var p = partner.profile || {};
    var name = p.name || 'Your partner';
    var t = tone(name);
    var trackName = (pf.trackNames && pf.trackNames[p.track_id]) || p.track_id || '';

    /* Sessions the two of you actually sat, counted off real rows. */
    var now = Date.now();
    var together = (sessions || []).filter(function(s){
      return (s.partnerName || '') === name;
    });
    var done = together.filter(function(s){
      return s.status === 'completed' ||
             (s.status === 'confirmed' && s.startsAt.getTime() + s.durationMin * 60000 <= now);
    });

    /* Longest current run of consecutive weeks containing a session. */
    var WEEK = 7 * 864e5, weeks = {};
    done.forEach(function(s){ weeks[Math.floor(s.startsAt.getTime() / WEEK)] = true; });
    var idx = Object.keys(weeks).map(Number).sort(function(a, b){ return a - b; });
    var streak = 0;
    if (idx.length) {
      var thisWeek = Math.floor(now / WEEK);
      streak = 1;
      for (var i = idx.length - 1; i > 0; i--) {
        if (idx[i] - idx[i - 1] === 1) streak++; else break;
      }
      /* A streak that ended more than a week ago is not current. */
      if (thisWeek - idx[idx.length - 1] > 1) streak = 0;
    }

    var attendance = (rel && rel.pct !== null && rel.counted > 0)
      ? rel.pct + '%' : '—';

    /* ---------- shared availability ---------- */
    var shared = pf.sharedSlots(profile && profile.availability, p.availability);

    var slotsHtml;
    if (!shared.length) {
      slotsHtml =
        '<p class="lede" style="margin:0">' +
          (((profile && profile.availability) || []).length
            ? 'You have no hours in common yet. Ask ' + esc(name.split(' ')[0]) +
              ' to add more windows, or widen your own.'
            : 'Set your weekly availability and the hours you share will appear here.') +
        ' <a href="app-profile.html" style="text-decoration:underline">Edit availability</a></p>';
    } else {
      slotsHtml = shared.map(function(slot){
        var hours = pf.slotHours(slot);
        var opts = hours.map(function(h){
          var hh = (h < 10 ? '0' : '') + h + ':00';
          return '<option value="' + h + '">' + hh + '</option>';
        }).join('');
        return '<div class="pt-slot" data-slot="' + esc(slot) + '">' +
                 '<span class="when">' + esc(pf.slotLabel(slot)) + '</span>' +
                 '<select aria-label="Time on ' + esc(pf.slotLabel(slot)) + '">' + opts + '</select>' +
                 '<button class="small" data-propose="' + esc(slot) + '">Propose</button>' +
               '</div>';
      }).join('');
    }

    /* ---------- why you matched ---------- */
    var why = [];
    if (p.track_id && profile && p.track_id === profile.track_id) why.push('Same path');
    if (p.topic && profile && profile.topic &&
        String(p.topic).toLowerCase().trim() === String(profile.topic).toLowerCase().trim()) {
      why.push('Same topic');
    }
    if (p.level && profile && p.level === profile.level) why.push('Same stage');
    if (p.timezone && profile && p.timezone === profile.timezone) why.push('Same timezone');
    if (shared.length) {
      why.push(shared.length + ' shared study window' + (shared.length === 1 ? '' : 's'));
    }
    if (!why.length) why.push('You agreed to study together');

    /* ---------- shared goal / stage ---------- */
    var plan = (window.PF_PLANS && profile && PF_PLANS[profile.track_id]) || null;
    var stage = Math.max(0, Math.min((plan ? plan.length - 1 : 0),
                                     (profile && profile.stage_index) | 0));
    var pct = plan ? Math.round(((stage) / plan.length) * 100) : 0;
    var goalHtml = plan
      ? '<h3>' + esc(trackName || 'Your path') + '</h3>' +
        '<p class="lede">Current stage: ' + esc(plan[stage].t) + '</p>' +
        '<div class="pt-bar"><i style="width:' + pct + '%"></i></div>' +
        '<p class="lede" style="margin:0">Week ' + (stage + 1) + ' of ' + plan.length +
          ' · ' + pct + '% through</p>'
      : '<h3>' + esc(trackName || 'Your path') + '</h3>' +
        '<p class="lede" style="margin:0">' +
          esc((profile && profile.topic) || 'Pick a path in your profile to track a plan.') + '</p>';

    root.innerHTML =
      '<div class="pt-head">' +
        '<span class="pt-face" style="background:' + t[0] + ';color:' + t[1] + '">' +
          esc(initial(name)) + '</span>' +
        '<div class="pt-id">' +
          '<h2>' + esc(name) + '</h2>' +
          '<div class="sub">' + esc(trackName) +
            (p.level ? ' · ' + esc(LEVEL[p.level] || p.level) : '') + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="pt-sec">' +
        '<div class="pt-stats">' +
          '<div><b>' + done.length + '</b><span>sessions together</span></div>' +
          '<div><b>' + esc(attendance) + '</b><span>your attendance</span></div>' +
          '<div><b>' + streak + '</b><span>week streak</span></div>' +
        '</div>' +
      '</div>' +

      '<div class="pt-sec">' + goalHtml + '</div>' +

      '<div class="pt-sec" id="schedule">' +
        '<h3>When you’re both free</h3>' +
        '<p class="lede">Pick an hour and propose it. Nothing is booked until ' +
          esc(name.split(' ')[0]) + ' accepts.</p>' +
        slotsHtml +
        '<p class="bk-status" id="pt-status" hidden></p>' +
      '</div>' +

      '<div class="pt-sec">' +
        '<h3>Why you matched</h3>' +
        '<div class="pt-why">' +
          why.map(function(w){ return '<span>' + esc(w) + '</span>'; }).join('') +
        '</div>' +
      '</div>' +

      '<div class="pt-danger">' +
        '<h3>Change partner</h3>' +
        '<p>Ending this keeps every session the two of you completed and all of ' +
          'your own progress. You’ll go back to finding a partner.</p>' +
        '<button class="btn" id="pt-end" type="button">End this partnership</button>' +
        '<div id="pt-endbox"></div>' +
      '</div>';

    wire(partner, profile, name);
  }

  /* ---------- actions ---------- */
  function wire(partner, profile, name){
    var status = document.getElementById('pt-status');

    function say(msg, bad){
      if (!status) return;
      status.hidden = false;
      status.textContent = msg;
      status.className = 'bk-status' + (bad ? ' bk-warn' : '');
    }

    /* Proposing writes a pair of rows through the existing proposeSession, so
       the two-row session model and its SECURITY DEFINER answering stay
       exactly as they were. */
    root.addEventListener('click', function(e){
      var btn = e.target.closest('[data-propose]');
      if (!btn) return;
      var row = btn.closest('.pt-slot');
      var slot = btn.getAttribute('data-propose');
      var hour = parseInt(row.querySelector('select').value, 10);
      var when = pf.nextDateFor(slot, hour);
      if (!when) return;

      btn.disabled = true;
      btn.textContent = 'Sending…';

      pf.proposeSession({
        partnerId: partner.profile.id,
        partnerName: name,
        myName: (profile && profile.name) || '',
        topic: (profile && profile.topic) || (pf.trackNames || {})[profile && profile.track_id] || null,
        startsAt: when.toISOString(),
        durationMin: (profile && profile.pref_minutes) || 50,
        roomUrl: partner.roomUrl,
        pairId: partner.requestId
      }).then(function(r){
        btn.disabled = false;
        btn.textContent = 'Propose';
        if (r && r.error) { say(r.error, true); return; }
        if (r && r.demo) { say('Demo mode — this would send ' + pf.slotLabel(slot) + '.'); return; }
        say('Sent. ' + name.split(' ')[0] + ' will see it on their Sessions page.');
        pf.notifyPartner(partner.profile.id, 'session_proposal',
          ((profile && profile.name) || 'Your partner') + ' proposed a time',
          when.toLocaleString([], { weekday:'long', hour:'2-digit', minute:'2-digit' }),
          'app-sessions.html');
      });
    });

    /* Ending a partnership asks first. It is reversible only by asking the
       other person again, so it should never happen on one stray click. */
    var endBtn = document.getElementById('pt-end');
    var endBox = document.getElementById('pt-endbox');
    if (endBtn) endBtn.addEventListener('click', function(){
      endBtn.hidden = true;
      endBox.innerHTML =
        '<div class="pt-confirm">' +
          '<p>End your partnership with ' + esc(name) + '? Your completed sessions ' +
            'and progress stay exactly as they are.</p>' +
          '<div class="row">' +
            '<button class="btn" id="pt-yes" type="button">Yes, end it</button>' +
            '<button class="ghost" id="pt-no" type="button">Keep my partner</button>' +
          '</div>' +
        '</div>';
      document.getElementById('pt-no').addEventListener('click', function(){
        endBox.innerHTML = '';
        endBtn.hidden = false;
        endBtn.focus();
      });
      document.getElementById('pt-yes').addEventListener('click', function(){
        var yes = document.getElementById('pt-yes');
        yes.disabled = true;
        yes.textContent = 'Ending…';
        pf.endPartnership(partner.requestId).then(function(r){
          if (r && r.error) {
            endBox.innerHTML = '<p class="bk-status bk-warn">' + esc(r.error) + '</p>';
            endBtn.hidden = false;
            return;
          }
          try { localStorage.setItem('pf_haspartner', '0'); } catch (err) {}
          location.href = 'app-people.html';
        });
      });
      document.getElementById('pt-yes').focus();
    });
  }

  /* ---------- load ---------- */
  if (!window.pf || !pf.ready || !pf.ready()) {
    /* file:// or no database configured. Show the shape of the page with
       obviously-demo content rather than an error. */
    root.innerHTML =
      '<div class="pt-sec"><h3>Demo mode</h3>' +
      '<p class="lede" style="margin:0">This page needs a signed-in account and a ' +
      'connected database. Everything it shows — sessions together, attendance, ' +
      'shared hours — is counted from real rows, so there is nothing to preview offline.</p></div>';
    return;
  }

  Promise.all([
    pf.primaryPartner(),
    pf.getProfile(),
    pf.fetchSessions(),
    pf.reliability()
  ]).then(function(r){
    var partner = r[0], profile = r[1] || null;
    if (!partner) { renderNoPartner(); return; }
    render(partner, profile, r[2] || [], r[3]);
  }).catch(function(){
    root.innerHTML = '<div class="pt-sec"><p class="lede" style="margin:0">' +
      'We couldn’t load your partner just now. Refresh the page to try again.</p></div>';
  });
})();
</script>

<script src="assets/usermenu.js"></script>
<script src="assets/notify.js"></script>
