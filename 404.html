<title>Page not found — PeerFlow</title>
<!-- Vercel serves this file, with a real 404 status, for any path in the
     deployment that matches no file and no rewrite. That is the whole wiring:
     there is no catch-all rewrite in vercel.json and there must not be one,
     because a rewrite answers 200 and a page that says "not found" under a 200
     is a soft 404 — search engines index it and every mistyped URL becomes a
     duplicate of this page. The status has to stay 404; only the body changes.

     noindex for the same reason from the other direction: the status already
     keeps this out of an index, and the tag means nothing changes if the page
     is ever reached some other way. It also puts the file in the noindex
     bucket in dev/seo-tests.js rather than the indexable one, where it would
     be asked for a canonical and a sitemap entry it must never have. -->
<meta name="robots" content="noindex">

     mistyped path of any depth — and a relative href there resolves against
     that address, so `login.html` under /a/b/c points at /a/b/login.html. The

       JavaScript to draw its own graphic and nothing moves after first paint.

       role="img" with the label, because to a screen reader 207 empty spans
       are 207 empty spans. The heading underneath says what happened; this
       says what is being looked at. -->
  <div class="nf-field" role="img" aria-label="404">

  </div>

  <h1>Page not found</h1>
  <p class="nf-s">This address doesn't match a page on PeerFlow. It was most likely a typo, or a link written before the page moved.</p>

  <!-- The address is added here rather than into the sentence above. Two
       reasons. Without JavaScript there is nothing to fill a gap in a sentence
       with, and a page reading "Nothing here answers to ." is worse than one
       that never mentioned the path. And the address is attacker-supplied text
       — whoever sends the link chooses it — so it only ever arrives through
       textContent, and keeping it in its own node means there is no markup
       around it to get that wrong in. -->
  <p class="nf-asked" hidden>You asked for <code id="nf-path"></code></p>

  <!-- Filled in and revealed by the resolver below when the address is a near
       miss for a real page, which is the case this page exists to rescue:
       /privacy, /frontend, /singup. Hidden the rest of the time, because a
       "did you mean" that guesses at random teaches people to stop reading
       it — and because hidden is the page the reference draws. -->
  <p class="nf-guess" hidden>Did you mean <a id="nf-guess-link" href="/"></a>?</p>

  <p class="nf-acts"><a class="btn big" href="/">Go to the home page</a></p>

</main>

<script>
/* The "did you mean" resolver.
 *
 * The reason it is worth having at all: most 404s on a site with no clean-URL
 * rewrites are not random. They are somebody typing peerflow.dev/privacy, or
 * /frontend, or /singup — an address that is one small step from a page that
 * exists. A nicer-looking 404 is still a dead end for those people; a line
 * naming the page they meant is not.
 *
 * Deliberately not a redirect. The address really is wrong, the status really
 * is 404, and silently landing somebody somewhere they did not ask for hides
 * the typo from them and from us. It offers the link and lets them take it.
 *
 * Written for the page rather than for assets/, and inline rather than as a
 * file, because it runs once, is read by nothing else, and a 404 page should
 * not spend a round trip fetching the thing that makes it useful. */
(function(){
  /* Every page a mistyped address could plausibly be aiming at, paired with
     what to call it in the sentence. It is written out by hand because this is
     a static site with no build step — there is nothing at request time to
     derive it from. dev/seo-tests.js asserts the list covers every indexable
     page, so a new landing path cannot quietly fall out of it.

     login, signup and app are here even though nothing on this page links to
     them: /login and /app are addresses people type. app.html gates itself and
     sends a signed-out visitor to the login page with a next parameter, so
     suggesting it is safe either way. */
  var PAGES = [
    ['index.html',                             'the home page'],
    ['ai-machine-learning-study-partner.html', 'AI and machine learning study partners'],
    ['backend-study-partner.html',             'backend study partners'],
    ['cybersecurity-study-partner.html',       'cybersecurity study partners'],
    ['data-science-study-partner.html',        'data science study partners'],
    ['devops-cloud-study-partner.html',        'DevOps and cloud study partners'],
    ['frontend-study-partner.html',            'frontend study partners'],
    ['mobile-development-study-partner.html',  'mobile development study partners'],
    ['ux-ui-design-study-partner.html',        'UX and UI design study partners'],
    ['conduct.html',                           'the code of conduct'],
    ['privacy.html',                           'the privacy policy'],
    ['terms.html',                             'the terms'],
    ['login.html',                             'the login page'],
    ['signup.html',                            'the sign-up page'],
    ['app.html',                               'your sessions']
  ];

  /* Levenshtein, iterative and single-row, because a 404 page is not the place
     to allocate a full matrix. Fifteen candidates against one short string. */
  function distance(a, b){
    if (a === b) return 0;
    var prev = [], i, j, tmp;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++){
      var cur = [i];
      for (j = 1; j <= b.length; j++){
        tmp = a.charAt(i - 1) === b.charAt(j - 1) ? prev[j - 1] : prev[j - 1] + 1;
        cur[j] = Math.min(cur[j - 1] + 1, prev[j] + 1, tmp);
      }
      prev = cur;
    }
    return prev[b.length];
  }

  var path = '';
  try { path = decodeURIComponent(location.pathname); }
  catch (e) { path = location.pathname; }   /* a stray % is not a crash */

  /* Show the address back, so the person can see the typo rather than being
     told abstractly that something is wrong. Capped, because the path is
     whoever-sent-the-link's text and an unbounded one would push the page
     apart; textContent, because it is that same text. */
  var shown = path.length > 64 ? path.slice(0, 63) + '…' : path;
  var pathEl = document.getElementById('nf-path');
  if (pathEl && path && path !== '/'){
    pathEl.textContent = shown;
    pathEl.parentNode.hidden = false;
  }

  /* Match on the last segment: /docs/privacy and /privacy are the same guess,
     and the segments in front are exactly the part that does not exist. */
  var parts = path.toLowerCase().split('/').filter(Boolean);
  var typed = parts.length ? parts[parts.length - 1] : '';
  typed = typed.replace(/\.html?$/, '');
  if (!typed) return;

  /* Three rules, tried in order, and the order is the confidence. An exact
     slug is not a guess at all — /privacy is privacy.html without its
     extension. A prefix is what somebody typing the short name of a long page
     does: /frontend for frontend-study-partner.html. Only then a spelling
     distance, and only for a string long enough that being two edits away
     means something: at three characters nearly everything is two edits from
     everything, and a wrong suggestion is worse than none.

     Within a rule the shortest page wins, so /data offers data-science rather
     than whichever long slug happened to be listed first. */
  var best = null, bestRule = 4, bestSlug = '';
  for (var k = 0; k < PAGES.length; k++){
    var slug = PAGES[k][0].replace(/\.html$/, '');
    var rule = slug === typed ? 1
             : (typed.length >= 3 && slug.indexOf(typed) === 0) ? 2
             : (typed.length >= 4 && distance(typed, slug) <= 2) ? 3
             : 4;
    if (rule === 4) continue;
    /* Slug against slug. Comparing a slug to PAGES[k][0] would be comparing it
       to a filename five characters longer, so the incumbent would win ties it
       had not earned. */
    if (rule < bestRule || (rule === bestRule && slug.length < bestSlug.length)){
      best = PAGES[k];
      bestRule = rule;
      bestSlug = slug;
    }
  }
  if (!best) return;

  var link = document.getElementById('nf-guess-link');
  if (!link) return;
  link.setAttribute('href', best[0] === 'index.html' ? '/' : '/' + best[0]);
  link.textContent = best[1];
  link.parentNode.hidden = false;
})();
</script>
