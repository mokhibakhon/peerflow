<body class="callpage">

<main class="room">

  <!-- ONE. Asking whether you may be here. Deliberately quiet: this is
       normally over in a few hundred milliseconds and a spinner that arrives
       instantly reads as a problem. -->
  <section class="rm-mid" id="st-load">
    <p class="rm-load">Opening the room…</p>
  </section>

  <!-- TWO. No — and every refusal is a sentence with something to press.
       The reasons come from session_for_call() in the database; the wording
       is written in call.js, because how you say "you're early" depends on
       how early. -->
  <section class="rm-mid" id="st-no" hidden>
    <div class="rm-card">
      <p class="rm-k" id="no-k"></p>
      <h1 id="no-h"></h1>
      <p class="rm-s" id="no-s"></p>
      <div class="rm-acts" id="no-a"></div>
    </div>
  </section>

  <!-- THREE. The lobby. Nobody joins a call without seeing their own face
       first — this is where you find out the camera is pointing at the
       ceiling, not thirty seconds into a session with somebody waiting. -->
  <section class="rm-lobby" id="st-lobby" hidden>
    <div class="lb-prev">
      <video id="lb-v" autoplay playsinline muted></video>
      <p class="lb-off" id="lb-off" hidden>Camera off</p>
      <div class="lb-meter" id="lb-meter" aria-hidden="true"><i id="lb-level"></i></div>
    </div>

    <div class="lb-side">
      <p class="rm-k">Ready when you are</p>
      <h1 id="lb-h">Your session</h1>
      <p class="rm-s" id="lb-s"></p>
      <p class="lb-goal" id="lb-goal" hidden></p>

      <div class="lb-toggles">
        <button class="lb-t on" type="button" id="lb-mic" aria-pressed="true">
          <span class="lb-ic" id="lb-mic-ic"></span><span id="lb-mic-l">Mic on</span>
        </button>
        <button class="lb-t on" type="button" id="lb-cam" aria-pressed="true">
          <span class="lb-ic" id="lb-cam-ic"></span><span id="lb-cam-l">Camera on</span>
        </button>
      </div>

      <div class="lb-dev" id="lb-dev" hidden>
        <label class="lb-l" for="lb-cams">Camera</label>
        <select id="lb-cams"></select>
        <label class="lb-l" for="lb-mics">Microphone</label>
        <select id="lb-mics"></select>
      </div>

      <div class="rm-acts">
        <button class="btn" type="button" id="lb-join">Join the call</button>
      </div>
      <p class="lb-err" id="lb-err" hidden></p>
    </div>
  </section>

  <!-- FOUR. The call. Two tiles and nothing else on screen: the partner
       fills the room, you sit in the corner, and the bar carries the four
       things you might actually want mid-session. -->
  <section class="rm-live" id="st-live" hidden>
    <div class="rm-stage" id="stage">
      <div class="tile tile-far" id="far">
        <video id="far-v" autoplay playsinline></video>
        <!-- The sentence is wrapped, and has to be. .tile-wait is a flex
             container so the text can sit dead centre of the tile, and a
             flex container turns each run of inline content into its own
             anonymous item — then strips the whitespace between them. The
             three pieces here ("Waiting for", the name, the ellipsis) came
             out as "Waiting forChatgpt…". One element means one flex item,
             and ordinary inline layout inside it. -->
        <p class="tile-wait" id="far-wait"><span>Waiting for <b id="far-who">your partner</b>…</span></p>
        <p class="tile-n" id="far-n" hidden></p>
        <p class="tile-off" id="far-off" hidden>Camera off</p>
      </div>
      <div class="tile tile-me" id="me">
        <video id="me-v" autoplay playsinline muted></video>
        <p class="tile-n">You</p>
        <p class="tile-off" id="me-off" hidden>Camera off</p>
      </div>
    </div>

    <div class="rm-bar">
      <p class="bar-goal" id="bar-goal" hidden></p>
      <div class="bar-c">
        <button class="c-b on" type="button" id="c-mic" aria-pressed="true" title="Microphone">
          <span class="c-ic" id="c-mic-ic"></span><span class="c-l">Mic</span>
        </button>
        <button class="c-b on" type="button" id="c-cam" aria-pressed="true" title="Camera">
          <span class="c-ic" id="c-cam-ic"></span><span class="c-l">Camera</span>
        </button>
        <button class="c-b" type="button" id="c-share" aria-pressed="false" title="Share your screen">
          <span class="c-ic" id="c-share-ic"></span><span class="c-l">Share</span>
        </button>
        <button class="c-b" type="button" id="c-sound" aria-expanded="false"
                aria-controls="sound-pop" title="Background sound, only for you">
          <span class="c-ic" id="c-sound-ic"></span><span class="c-l">Sound</span>
        </button>
        <button class="c-b c-leave" type="button" id="c-leave">Leave</button>

        <!-- Only ever heard by the person who chose it; nothing here is
             published into the call. -->
        <div class="snd-pop" id="sound-pop" hidden>
          <p class="snd-k">Background sound<span>only you hear this</span></p>
          <div class="snd-grid" id="snd-grid"></div>
          <label class="snd-vol">
            <span class="snd-vl">Volume</span>
            <input type="range" id="snd-vol" min="0" max="100" value="35"
                   aria-label="Background sound volume">
          </label>
        </div>
      </div>
      <div class="bar-end">
        <p class="bar-clock" id="bar-clock"></p>
        <div class="ph-rail" id="ph-rail" aria-hidden="true"></div>
      </div>
    </div>

    <p class="rm-flash" id="rm-flash" hidden></p>
  </section>

  <!-- FIVE. Over. -->
  <section class="rm-mid" id="st-done" hidden>
    <div class="rm-card">
      <p class="rm-k">Session over</p>
      <h1 id="done-h">You've left the call</h1>
      <p class="rm-s" id="done-s"></p>
      <div class="rm-acts">
        <button class="btn" type="button" id="done-back">Back to today</button>
        <button class="ghost" type="button" id="done-again" hidden>Rejoin</button>
      </div>
    </div>
  </section>
</main>

<!-- Pinned to an exact version with the hash of that exact file, so the code
     that gets handed your camera is the code we checked and not whatever the
     CDN is serving under a moving tag today. -->
